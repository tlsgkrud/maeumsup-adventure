  const FOLLOWUP_BRANCHES = { ego: EGO_FOLLOWUPS, persona: PERSONA_FOLLOWUPS };

  // a small mask dangling from a branch tip by a thin string — used to give the persona
  // thicket its "masks hanging from the trees" feel
  function hangingMaskAt(x, y){
    const delay = (Math.random() * -4).toFixed(2) + "s";
    return `
      <g class="hanging-mask" style="transform-origin:${x}px ${y}px; animation-delay:${delay}">
        <line x1="${x}" y1="${y}" x2="${x}" y2="${y+13}" stroke="#4a3a28" stroke-width="1"/>
        <ellipse cx="${x}" cy="${y+22}" rx="7" ry="9" fill="#e8dcc0" stroke="#4a3a28" stroke-width="1.2"/>
        <ellipse cx="${x-2.6}" cy="${y+20}" rx="1.5" ry="2" fill="#241c18"/>
        <ellipse cx="${x+2.6}" cy="${y+20}" rx="1.5" ry="2" fill="#241c18"/>
        <path d="M${x-2},${y+26} Q${x},${y+28} ${x+2},${y+26}" stroke="#4a3a28" stroke-width="0.8" fill="none"/>
      </g>`;
  }

  function treeMarkup(color, withMasks){
    const key = ensureTreeGradients(color);
    const dk2 = shade(color, -18);
    const lt = shade(color, 22);
    const moss = shade(color, 48);
    const jitter = () => Math.random() * 6 - 3;
    // at most one mask per tree, and only when this specific tree was chosen to carry one —
    // keeping density low so the forest reads as eerie rather than overwhelming
    const masks = withMasks ? (Math.random() < 0.5 ? hangingMaskAt(34, 131) : hangingMaskAt(80, 124)) : "";
    return `
    <svg viewBox="0 0 120 170" width="100%" height="100%" preserveAspectRatio="xMidYMax meet">
      <!-- soft contact shadow that fades into the ground rather than a hard-edged ellipse,
           so the trunk visibly blends into the floor instead of looking cut out of it -->
      <ellipse cx="60" cy="161" rx="42" ry="9" fill="url(#${key}-shadow)"/>
      <!-- roots splaying into the soil, so the trunk reads as grown out of the ground rather than resting on it -->
      <path d="M56,157 Q46,163 36,168" stroke="#2a1d12" stroke-width="3.4" fill="none" stroke-linecap="round" opacity="0.65"/>
      <path d="M64,157 Q75,163 85,168" stroke="#2a1d12" stroke-width="3.2" fill="none" stroke-linecap="round" opacity="0.6"/>

      <path d="M59,98 Q59,128 58,160" stroke="#2a1d12" stroke-width="1" fill="none" opacity="0.35"/>
      <path d="M50,112 Q42,118 35,130" stroke="#3c2c1e" stroke-width="5" fill="none" stroke-linecap="round" opacity="0.75"/>
      <path d="M62,108 Q73,113 80,124" stroke="#3c2c1e" stroke-width="4.5" fill="none" stroke-linecap="round" opacity="0.7"/>

           without the render cost of an actual blur filter, which added up fast across a
           whole forest of trees and was the main cause of the startup lag -->
      <circle cx="49" cy="149" r="6.5" fill="url(#${key}-moss)"/>
      <circle cx="49" cy="149" r="2.6" fill="${moss}" opacity="0.65"/>
      <circle cx="68" cy="140" r="4.5" fill="url(#${key}-moss)"/>

      <circle cx="33" cy="70" r="4" fill="${moss}" opacity="0.4"/>
      <circle cx="88" cy="66" r="3.2" fill="${moss}" opacity="0.32"/>

    </svg>`;
  }

  // a "clump" bundles several trees into one wider billboard, so placing a handful of
  // clumps reads as a thicket — much denser than scattering the same number of single trees
  function treeClumpMarkup(color, n, withMasks){
    let inner = "";
    // decide once per clump (not per tree) whether it carries a mask at all, and if so,
    // only one tree in it gets one — keeps the forest-of-masks feeling sparse, not overwhelming
    const maskedTree = withMasks && Math.random() < 0.3 ? Math.floor(Math.random() * n) : -1;
    for (let i = 0; i < n; i++){
      const w = 46 + Math.random() * 30;
      const left = (i / n) * 100 + (Math.random() * 18 - 9);
      // bottom is always 0 — every tree's own baked-in ground shadow must sit flush with
      // the clump container's bottom edge, or it visibly floats above the ground plane
      inner += `<div style="position:absolute; left:${left.toFixed(1)}%; bottom:0; width:${w.toFixed(1)}%; aspect-ratio:120/170; transform:translateX(-50%);">${treeMarkup(color, i === maskedTree)}</div>`;
    }
    return `<div style="position:relative; width:100%; height:100%;">${inner}</div>`;
  }

  /* ---------------- the anima guide takes the shape you were drawn to ----------------

  // redraw the guide (in the scene and in the pool's reflection) after its form changed
  function refreshAnimaGuide(flash){
    if (!scene || scene.layer.key !== "anima" || !scene.npcObj) return;
    if (USE3D){ Forest3D.world.setAnimaForm(state.animaForm, flash); if (flash) Sound.chime(); return; }

      setTimeout(() => el.classList.remove("morph"), 1400);
      Sound.chime();
    }
    scene.dirty = true;
  }
  function hexToRgba(hex, a){

    <svg viewBox="0 0 70 70" width="100%" height="100%" preserveAspectRatio="xMidYMax meet">
      <ellipse cx="35" cy="66" rx="20" ry="4" fill="#000" opacity="0.3"/>
      <path d="M14,64 Q35,48 56,64 Z" fill="${shade(color, -30)}" stroke="${shade(color, -55)}" stroke-width="1.5"/>
      <path d="M22,52 Q20,36 34,32 Q46,30 50,40 Q54,50 44,55 Q32,59 22,52 Z" fill="#f6f2ff" stroke="#9c8fb8" stroke-width="1.6"/>
      <path d="M30,44 Q38,34 50,42 Q42,48 30,44 Z" fill="#e2dcf2" stroke="#9c8fb8" stroke-width="1.2"/>
      <circle cx="44" cy="30" r="7" fill="#f6f2ff" stroke="#9c8fb8" stroke-width="1.6"/>
      <circle cx="46" cy="29" r="1.3" fill="#2a2038"/>
      <path d="M50.5,30.5 L56,32 L50.5,33" fill="#e8b45a"/>
      <path d="M22,52 L12,56 L21,49" fill="#f6f2ff" stroke="#9c8fb8" stroke-width="1.2"/>
    </svg>`;
  }
  // the still water in front of the anima guide: the guide and the moon behind it appear
  // upside down in it — the unconscious as the water that reflects what stands above it
  function moonPoolObjMarkup(layer){
    return `<div class="moon-puddle">
      <div class="mp-water"></div>
      <div class="mp-moon"></div>
      <div class="mp-glint"></div>
      <div class="mp-ripples"></div>
      <div class="mp-sheen"></div>
    </div>`;
  }


  /* ---------------- inner obstacles ----------------
     Each layer has one short obstacle that is about the layer's theme, not about reflexes —
     there is no failing and no going back, and each takes only a few seconds:
       ego      fog thickens; it only lifts if you stop walking and stand still a moment
       shadow   the shadow backs away while you chase it; stand still and it comes to you
       anima    nothing blocks you — the moon, the pool and the guide are the moment here
     */
  function buildObstacles(layer, objects, npcZ){
    const out = { obs: null };
    const midZ = Math.round(npcZ * 0.48);
    if (layer.key === "ego"){
      out.obs = { type: "fog", z: midZ, p: 0, cleared: false, hinted: false };
    } else if (layer.key === "shadow"){
      out.obs = { type: "retreat", retreated: 0, still: 0, settled: false, hinted: false };
    }
    return out;
  }
  function obstacleBlocks(){
    const o = scene && scene.obs;
    return !!(o && !o.cleared && o.type === "fog");
  }
  function moveNpc(d){
    scene.npcZ += d;
    if (scene.npcObj) scene.npcObj.z += d;
    scene.dirty = true;
  }
  function updateObstacles(dt, now){
    const o = scene.obs;
    const fog = document.getElementById("fpFog");
    if (!o) return;
    if (o.type === "fog"){
      if (!o.cleared){
        const near = Math.max(0, Math.min(1, (scene.traveled - (o.z - 650)) / 500));
        const atWall = scene.traveled >= o.z - 155;
        if (atWall){
          if (!o.hinted){ o.hinted = true; showEdgeHint("안개가 짙어요 — 걷기를 멈추고 잠시 숨을 골라 보세요", 3000); }
          if (!keys.forward && scene.speed === 0) o.p = Math.min(1, o.p + dt / 2500);
          else o.p = Math.max(0, o.p - dt / 1800);
          if (o.p >= 1){
            o.cleared = true;
            Sound.chime();
            showEdgeHint("안개가 걷혔어요. 멈춰 설 때, 비로소 보이는 것들이 있어요", 3000);
          }
        }
        fog.style.opacity = (near * (1 - o.p) * 0.95).toFixed(3);
        fog.classList.toggle("breathing", atWall && !o.cleared);
        document.getElementById("fogRing").style.strokeDashoffset = (113.1 * (1 - o.p)).toFixed(1);
      } else if (!o.faded){
        o.faded = true;
        fog.classList.remove("breathing");
        fog.style.opacity = "0";
      }
    }
    if (o.type === "retreat" && !o.settled && !scene.answered){
      const dist = scene.npcZ - scene.traveled;
      if (dist < 640){
        if (!o.hinted){ o.hinted = true; showEdgeHint("그림자가 뒷걸음질 쳐요… 쫓아가지 말고, 멈춰서 기다려 보세요", 3400); }
        // chasing never closes the gap (up to a generous limit) — only stopping does
        if (scene.speed > 0.05 && o.retreated < 1500){
          const d = scene.speed * dt;
          moveNpc(d);
          o.retreated += d;
          o.still = 0;
        } else if (scene.speed === 0){
          o.still += dt;
          if (o.still > 1000){
            const step = Math.min(dist - 200, dt * (USE3D ? 0.2 : 0.75));
            if (step > 0.5) moveNpc(-step);
            else { o.settled = true; showEdgeHint("기다려 주니, 그림자가 먼저 다가왔어요", 2600); }
          }
        } else {
          o.still = 0;
        }
      }
    }
  }

  function makeObj({type, x, y=0, z, width, height, anchor, html}){
    const el = document.createElement("div");
    if (USE3D){
      el.className = "anchor3d";
      document.getElementById("anchors3d").appendChild(el);
      return { type, x, y, z, anchor, el, hidden: false };
    }
    el.className = "fp-obj";
    el.style.width = width + "px";
    el.style.height = height + "px";
    el.innerHTML = html;
    fpObjects.appendChild(el);
    return { type, x, y, z, anchor, el, hidden: false };
  }

  /* The 3D scene: same `scene` object and game logic as the flat one; forest3d.js does the drawing. */
  function buildScene3D(idx){
    const layer = layers[idx], isSelf = layer.key === "self", atm = layer.atmosphere;
    // the world's own light does most of the mood now, so the shadow's vignette can ease off
    sceneViewportEl.style.setProperty("--vig-color", layer.key === "shadow" ? "rgba(8,6,22,0.5)" : atm.vignette);
    sceneViewportEl.style.setProperty("--vig-clear", layer.key === "shadow" ? "42%" : atm.clear);
    sceneViewportEl.classList.remove("bridge", "after-rain", "shore", "moonlit", "dense");
    sceneViewportEl.classList.toggle("raining", layer.key === "shadow");
    if (layer.key === "shadow") Rain.start(); else Rain.stop(true);
    document.getElementById("anchors3d").innerHTML = "";
    const fogEl = document.getElementById("fpFog");
    fogEl.style.opacity = "0";
    fogEl.classList.remove("breathing");
    const spec = l => l.key === "shadow"
      ? { key: l.key, outfit: shadowOutfit(), hair: AVATAR.hair, skin: "#c9b2a0", iris: shade(l.light, 40), hat: "#1c1830", accessory: l.accessory }
      : { key: l.key, outfit: l.npcOutfit || shade(l.light, 22), hair: "#241c30", iris: shade(l.light, 40), hat: shade(l.light, 70), accessory: l.accessory };
    const world = Forest3D.build({
      key: layer.key,
      avatar: { outfit: AVATAR.outfit, hair: AVATAR.hair },
      guide: isSelf ? null : spec(layer),
      ring: isSelf ? layers.filter(l => l.key !== "self").map(spec) : [],
      animaForm: layer.key === "anima" ? state.animaForm : null
    });
    const objects = [];
    const npcZ = isSelf ? null : Math.round(world.GUIDE_U * K3);
    let npcRef = null, extras = { obs: null };
    if (!isSelf){
      npcRef = makeObj({ type: "npc", x: 0, z: npcZ, width: 1, height: 1, anchor: "bottom", html: "" });
      objects.push(npcRef);
      extras = buildObstacles(layer, objects, npcZ);
    } else {
      objects.push(makeObj({ type: "core", x: 0, z: world.GUIDE_U * K3, width: 1, height: 1, anchor: "bottom", html: "" }));
      ["persona", "ego", "shadow", "anima"].forEach((key, i) => {
        const o = makeObj({ type: "guide", x: 0, z: 0, width: 1, height: 1, anchor: "bottom", html: "" });
        o.el.classList.add("guide-inner"); o.el.dataset.key = key;
        o.key = key; o.appearAt = 380 + i * 170;
        objects.push(o);
      });
    }
    sceneTitle.innerHTML = `${layer.icon || ""} ${layer.name}<span class="scene-step">${idx + 1} / ${layers.length}</span>`;
    document.getElementById("sceneHint").textContent = IS_TOUCH ? "" : "W/↑ 걷기 · A/D 방향 · 드래그 둘러보기 · Space 점프·대화 · V 내 모습";
    const oldEnding = sceneViewportEl.querySelector(".self-ending");
    if (oldEnding) oldEnding.remove();
    sceneView.classList.remove("ending");
    introSubtitle.textContent = "";
    talkPrompt.classList.remove("show");
    edgeHint.classList.remove("show");
    sceneFlashEl.classList.remove("show");
    const btnV = document.getElementById("btnView");
    btnV.classList.remove("near"); btnV.setAttribute("aria-pressed", "false");
    scene = {
      idx, layer, isSelf, objects, npcZ, npcObj: npcRef,
      obs: extras.obs, pool: layer.moonPool ? {} : null,
      atm, lastSkyT: -1, dirty: true, last: { traveled: -1, look: 99, bob: 99 }, talkReady: null,
      traveled: world.S.u * K3, speed: 0, bobPhase: 0, bobAmp: 0, lookAngle: 0,
      doorZ: null, doorTriggered: false,
      answered: false, ended: false, lastHintAt: 0, branchId: null,
      selfEnd: isSelf ? (world.GUIDE_U - 3.2) * K3 : null
    };
  }
  function syncAnchors3D(){
    const W = Forest3D.world;
    scene.objects.forEach(o => {
      const name = o.type === "npc" ? "guide" : o.type === "core" ? "figure" : o.type === "guide" ? o.key : null;
      if (!name) return;
      const r = W.rect(name);
      if (!r) return;
      o.el.style.left = (r.x - r.width / 2) + "px"; o.el.style.top = r.top + "px";
      o.el.style.width = r.width + "px"; o.el.style.height = r.height + "px";
    });
  }
  function loop3D(now, dt){
    const W = Forest3D.world;
    if (!scene || !W) return;
    if (overlay.classList.contains("open") || infoOverlay.classList.contains("open") || scene.ending){
      Forest3D.frame(now, dt, { frozen: true, npcU: scene.npcZ != null ? scene.npcZ / K3 : null });
      syncAnchors3D();
      return;
    }
    let cap = scene.isSelf ? scene.selfEnd + 24 : (scene.answered ? scene.doorZ + 120 : scene.npcZ - W.stopDist * K3);
    const blocked = obstacleBlocks();
    if (blocked) cap = Math.min(cap, scene.obs.z - 150 + 24);
    const r = Forest3D.frame(now, dt, {
      fwd: keys.forward, back: keys.back, left: keys.lookL, right: keys.lookR,
      maxU: cap / K3, npcU: scene.npcZ != null ? scene.npcZ / K3 : null,
      slow: scene.isSelf ? Math.max(0.32, Math.min(1, (cap - scene.traveled) / 420)) : 1,
      onViewEnd(){ const b = document.getElementById("btnView"); b.classList.remove("near"); b.setAttribute("aria-pressed", "false"); }
    });
    scene.traveled = r.u * K3;
    scene.speed = r.speed > 0 ? r.speed * K3 / 1000 : (r.speed < 0 ? -0.01 : 0);
    if (Math.abs(r.speed) > 1 && now - (scene.lastStepAt || 0) > 430){ scene.lastStepAt = now; Sound.step(); }
    if (!scene.isSelf && !scene.answered && !blocked && keys.forward && scene.traveled >= cap - 20 && now - scene.lastHintAt > 2400){
      scene.lastHintAt = now;
      showEdgeHint(`먼저 ${scene.layer.npcName}와 이야기를 나눠보세요`);
    }
    if (!scene.isSelf){ updateObstacles(dt, now); revealNpc(scene.npcZ - scene.traveled); }
    scene.objects.forEach(o => { if (o.appearAt != null) W.setRingAppear(o.key, Math.max(0, Math.min(1, (scene.traveled - o.appearAt) / 320))); });
    syncAnchors3D();
    checkTriggers(true);
  }

  function buildScene(idx){
    if (USE3D) return buildScene3D(idx);
    const layer = layers[idx];
    const isSelf = layer.key === "self";

    const isDense = (layer.treesPerClump || 1) > 1;
    sceneViewportEl.classList.toggle("dense", isDense);
    // two stacked sky layers (start and end of this layer's time of day); walking only fades
    // the second one in — an opacity change the compositor handles, instead of rebuilding a
    // gradient string and repainting the whole sky every frame
    const atm = layer.atmosphere;
    fpSky.style.background = `linear-gradient(to bottom, ${atm.from[0]} 0%, ${atm.from[1]} 100%)`;
    fpSky2.style.background = `linear-gradient(to bottom, ${atm.to[0]} 0%, ${atm.to[1]} 100%)`;
    fpSky2.style.opacity = "0";
    sceneRaysEl.style.opacity = String(atm.rays[0]);
    sceneViewportEl.style.setProperty("--vig-color", atm.vignette);
    sceneViewportEl.style.setProperty("--vig-clear", atm.clear);
    document.getElementById("fpMotes").style.setProperty("--mote-rgb", atm.mote);
    document.getElementById("fpMotes").style.opacity = atm.moteOp != null ? String(atm.moteOp) : "";
    // subtle tall-grass blade texture on the flat ground backdrop
    // just a soft, unpatterned hint of grassy variation — no repeating motif, no lane markings
    const patchA = shade(layer.light, 22) + "12";
    const patchB = shade(layer.light, 10) + "0e";
    fpGround.style.backgroundImage = `
      radial-gradient(circle, rgba(255,255,255,0.05) 0 1px, transparent 1.6px),
      radial-gradient(ellipse 60% 40% at 28% 22%, ${patchA}, transparent 65%),
      radial-gradient(ellipse 55% 35% at 72% 58%, ${patchB}, transparent 60%),
      linear-gradient(to bottom, ${shade(layer.dark, -6)}, ${shade(layer.dark, -34)})`;
    fpGround.style.backgroundSize = "23px 18px, auto, auto, auto";
    fpGround.style.backgroundPosition = "0 0, 0 0, 0 0, 0 0";
    sceneViewportEl.classList.toggle("shore", isSelf);
    sceneViewportEl.classList.toggle("moonlit", !!layer.moonPool);
    sceneViewportEl.classList.remove("bridge");
    fpMoon.style.transform = "";
    moonRoad.style.transform = "";
    moonRoad.innerHTML = "";
    // rain over the shadow layer — heavy, damp, close — until you've faced it
    sceneViewportEl.classList.toggle("raining", layer.key === "shadow");
    if (layer.key === "shadow") Rain.start(); else Rain.stop(true);
    sceneViewportEl.classList.remove("after-rain");
    if (isSelf){
      // dawn sand: pale near the waterline, warmer toward your feet
      fpGround.style.backgroundImage = `
        radial-gradient(circle, rgba(255,255,255,0.10) 0 1px, transparent 1.6px),
        radial-gradient(ellipse 60% 40% at 30% 30%, rgba(255,240,205,0.25), transparent 65%),
        radial-gradient(ellipse 55% 35% at 70% 70%, rgba(160,110,50,0.18), transparent 60%),
        linear-gradient(to bottom, #f0d3a0, #d9a85c 60%, #b98436)`;
      sceneViewportEl.style.setProperty("--sun-y", "26px");
    }
    fpObjects.innerHTML = "";

    const npcZ = isSelf ? null : (layer.npcDist || NPC_Z);
    const objects = [];
    const sceneExtras = { obs: null };
    const fogEl = document.getElementById("fpFog");
    fogEl.style.opacity = "0";
    fogEl.classList.remove("breathing");
    if (!isSelf){
      // phones get a somewhat thinner forest — the densest layer is ~120 tree drawings
      // the forest grows with the longer path, so the trees don't thin out along it
      const count = Math.round((layer.bushCount || 11) * (IS_TOUCH ? 0.7 : 1) * PATH_FOREST);
      const xMin = layer.bushXMin != null ? layer.bushXMin : 150;
      const xRange = layer.bushXRange != null ? layer.bushXRange : 190;
      const perClump = layer.treesPerClump || 1;
      const zBase = isDense ? 90 : 260;
      // trees now fill almost all the way up to the NPC — just enough buffer (80 units) that
      // a clump never renders exactly on top of the NPC's own billboard
      const usableZ = npcZ - 80 - zBase;
      // for a dense forest, guarantee a clump on BOTH sides at every depth step, instead of
      // alternating sides per step. One fully-random x per step (old approach) occasionally
      // left a whole side empty at some depth — invisible dead-ahead, but panning the camera
      // (near things swing across the screen faster than far ones, ordinary motion parallax)
      // walks that empty depth right into view. This keeps the same fine depth spacing as
      // before (so no gaps *between* depths either) and just doubles up per step.
      const steps = isDense ? Math.max(1, Math.round(count / 2)) : count;
      const bushMakers = [];
      if (isDense){
        // lateral placement is measured from the clump's INNER edge, so a clump never spreads
        // across the path itself (a wide clump centered near x=0 used to hide the guide from
        // the start), and the spread is a fixed band rather than one that grows with depth —
        // scaling it with absolute depth pushed the trees nearest the guide far off to the
        // sides, so the forest seemed to vanish just as you arrived.
        const clumpW = 150 + perClump * 55;
        const pathHalf = xMin + 26;
        const spread = 720;
        for (let i = 0; i < steps; i++){
          const z = zBase + (i * (usableZ / steps)) + (Math.random() * 50 - 25);
          [-1, 1].forEach((side, sIdx) => {
            // alternating which half of the band each side favors (and flipping it step to
            // step) means a gap left by one sample is covered by its neighbor one step away
            // instead of lining up into a visible hole
            const favorFar = (i + sIdx) % 2 === 0;
            const frac = favorFar ? (0.5 + Math.random() * 0.5) : (Math.random() * 0.5);
            bushMakers.push({ z: z + (Math.random() * 30 - 15), x: side * (pathHalf + clumpW / 2 + spread * frac) });
          });
        }
      } else {
        for (let i = 0; i < count; i++){
          const z = zBase + (i * (usableZ / count)) + (Math.random() * 90 - 45);
          const side = i % 2 === 0 ? -1 : 1;
          bushMakers.push({ z, x: side * (xMin + Math.random() * xRange) });
        }
      }
      bushMakers.forEach(({ x, z }) => {
        objects.push(makeObj({
          type: "bush", x, z,
          width: perClump > 1 ? 150 + perClump * 55 : 150,
          height: perClump > 1 ? 250 : 220,
          anchor: "bottom",
          html: `<div class="bush3d">${perClump > 1 ? treeClumpMarkup(layer.light, perClump, layer.hasMasks) : treeMarkup(layer.light, layer.hasMasks)}</div>`
        }));
      });
      if (layer.decorItems){
        // a layer with its own found-object set gets those scattered along the path
        // instead of flowers — see decorItems on the shadow layer
        const decorCount = layer.decorCount || 7;
        const decorOffset = Math.floor(Math.random() * layer.decorItems.length);
        for (let i = 0; i < decorCount; i++){
          let z = 220 + (i * (usableZ / decorCount)) + (Math.random()*80 - 40);
          const side = i % 2 === 0 ? -1 : 1;
          // pulled in toward the path (and a bit larger) so the found objects stand in front
          // of the trees instead of being swallowed by the thicket behind them
          const [dxMin, dxRange] = layer.decorX || [55, 110];
          let x = side * (dxMin + Math.random() * dxRange);
          if (layer.decorAmongTrees){
            // halfway between two rows of tree clumps, inside the tree band: seen between the
            // trunks, not standing on the path
            const stepZ = usableZ / steps;
            const j = Math.min(steps - 2, Math.round((i + 0.5) * steps / decorCount));
            z = zBase + (j + 0.5) * stepZ;
            x = side * (xMin + 95 + Math.random() * 130);
          }
          const k = layer.decorScale || 1;
          // cycle through the set so every kind of object shows up at least once
          const item = layer.decorItems[(i + decorOffset) % layer.decorItems.length];
          const dObj = makeObj({
            type: "decor", x, z, width: item.w * k, height: item.h * k, anchor: "bottom",
            html: item.markup(item.color || layer.light)
          });
          dObj.el.classList.add("decor");
          objects.push(dObj);
        }
      } else {
        const flowerCount = 8;
        for (let i = 0; i < flowerCount; i++){
          const z = 220 + (i * (usableZ / flowerCount)) + (Math.random()*80 - 40);
          const side = i % 2 === 0 ? -1 : 1;
          const x = side * (35 + Math.random()*90);
          objects.push(makeObj({
            type: "flower", x, z, width: 26, height: 26, anchor: "bottom",
            html: flowerMarkup()
          }));
        }
      }
      const npcObj = makeObj({
        type: "npc", x: 0, z: npcZ, width: 110, height: 152, anchor: "bottom",
        html: `<div class="npc-halo" style="--halo:${hexToRgba(shade(layer.light, 90), layer.key === "shadow" ? 0.32 : 0.45)}"></div>` +
              `<div class="idle-breathe">${npcSVG(layer)}</div>`
      });
      npcObj.el.classList.add("walking");
      objects.push(npcObj);
      if (layer.moonPool){
        // lowered (y) so it lies on the ground in front of the guide's feet instead of standing
        // on the horizon line like everything else, where it covered the guide's legs
        const pool = makeObj({ type: "pool", x: 0, y: 46, z: npcZ - 55, width: 280, height: 62, anchor: "bottom", html: moonPoolObjMarkup(layer) });
        pool.el.classList.add("pool-obj");
        objects.push(pool);
        sceneExtras.pool = pool;
      }
      Object.assign(sceneExtras, buildObstacles(layer, objects, npcZ));
    } else {
      objects.push(makeObj({
        type: "core", x: 0, z: SELF_Z, width: 130, height: 178, anchor: "bottom",
        html: `<div class="self-halo"></div>` +
              `<div class="self-sparks" aria-hidden="true">${"<i></i>".repeat(7)}</div>` +
              `<div class="idle-breathe">${chibiSVG({ skin: "#fff1d6", hair: "#f2bd45", outfit: "#ffd45e", light: "#f4c24d", accessory: "halo" })}</div>`
      }));
      objects[objects.length - 1].el.classList.add("self-figure");
      // the four guides met along the way stand in a loose ring around the center and
      // appear one by one over the last stretch of the walk
      const GUIDE_SPOTS = [
        { key: "persona", x: -150, dz: 40 }, { key: "ego", x: 150, dz: 40 },
        { key: "shadow", x: -275, dz: 190 }, { key: "anima", x: 275, dz: 190 }
      ];
      // pull the ring in on narrow screens so the outer two aren't cut off at the edges
      const ringSpread = Math.max(0.55, Math.min(1, sceneViewportEl.clientWidth / 760));
      GUIDE_SPOTS.forEach((g, i) => {
        const gl = layers.find(l => l.key === g.key);
        const o = makeObj({
          type: "guide", x: g.x * ringSpread, z: SELF_Z + g.dz, width: 84, height: 116, anchor: "bottom",
          html: `<div class="guide-inner pleased${g.key === "persona" ? " unmasked" : ""}" data-key="${g.key}"><div class="idle-breathe">${npcSVG(gl)}</div></div>`
        });
        o.appearAt = 420 + i * 180;
        o.key = g.key;
        objects.push(o);
      });
    }
    const npcRef = objects.find(o => o.type === "npc") || null;

    sceneTitle.innerHTML = `${layer.icon || ""} ${layer.name}<span class="scene-step">${idx + 1} / ${layers.length}</span>`;
    const oldEnding = sceneViewportEl.querySelector(".self-ending");
    if (oldEnding) oldEnding.remove();
    sceneView.classList.remove("ending");
    introSubtitle.textContent = isSelf
      ? "숲 끝에 새벽 바다가 열려요. 빛을 향해 걸어가 보세요."
      : `앞으로 걸어가 ${layer.npcName}에게 다가가 보세요.`;

    talkPrompt.classList.remove("show");
    edgeHint.classList.remove("show");
    sceneFlashEl.classList.remove("show");
    fpWorld.style.transform = "rotateY(0deg)";
    fpBob.style.transform = "translateY(0px)";
    fpGround.style.transform = "translateY(0px)";

    scene = {
      idx, layer, isSelf, objects, npcZ, npcObj: npcRef,
      obs: sceneExtras.obs,
      pool: sceneExtras.pool || null,
      atm, lastSkyT: -1, dirty: true, last: { traveled: -1, look: 99, bob: 99 }, talkReady: null,
      traveled: 0, speed: 0, bobPhase: 0, bobAmp: 0, lookAngle: 0,
      doorZ: null, doorTriggered: false,
      answered: false, ended: false, lastHintAt: 0,
      branchId: null
    };
  }

  function enterScene(idx){
    document.body.classList.add("in-scene");
    if (USE3D) document.body.classList.add("scene3d");
    stopMotes();
    Sound.ambience(layers[idx].key);
    mapView.classList.add("hidden");
    sceneView.classList.remove("hidden");
    buildScene(idx);
    lastTime = performance.now();
    if (rafId) cancelAnimationFrame(rafId);
    rafId = requestAnimationFrame(loop);
    // give people a beat to take in the scene before the concept explainer pops up — only
    // the first time per layer; after that it's one tap away on ⓘ instead of interrupting
    const key = layers[idx].key;
    if (!state.seenInfo) state.seenInfo = {};
    if (!state.seenInfo[key]){
      setTimeout(() => {
        if (scene && scene.idx === idx){ showInfo(scene.layer); state.seenInfo[key] = true; save(); }
      }, 700);
    }
  }

  let sceneTransitionTimer = null;
  function leaveScene(){
    if (rafId) cancelAnimationFrame(rafId);
    rafId = null;
    Rain.stop(true);
    clearSelfEnding();
    clearTimeout(sceneTransitionTimer);
    sceneTransitionTimer = null;
    releaseKeys();
    if (overlay.classList.contains("dialogue-mode")) closeOverlay();
    scene = null;
    document.body.classList.remove("in-scene", "scene3d");
    if (USE3D) Forest3D.clear();
    startMotes();
    Sound.ambience("map");
    sceneView.classList.add("hidden");
    mapView.classList.remove("hidden");
    introSubtitle.innerHTML = "겉을 둘러싼 수풀을 헤치고, 원 하나씩 안으로 들어가 보세요.<br>중심에는 당신 자신, &lsquo;자기(Self)&rsquo;가 있습니다.";
    renderMap();
  }


  /* ---------------- the Self ending ----------------
     No questions — just something to watch. You come to rest before the light; the four guides around it each send their token flying in to circle
     you, the layers' rings draw themselves into a mandala, the guides dissolve into light
     (back into you), gold fills the view, and a few lines appear. Skippable; with reduced
     motion it is a quiet fade with no movement. Says you are already whole ("온전한"), never
     "complete": the Self is there from the start, and individuation is coming to know it. */
  let endingTimers = [];
  function clearSelfEnding(){
    endingTimers.forEach(clearTimeout);
    endingTimers = [];
    const el = sceneViewportEl.querySelector(".self-ending");
    if (el) el.remove();
    sceneView.classList.remove("ending");
  }
  function startSelfEnding(){
    if (!scene || scene.ending || scene.ended) return;
    scene.ending = true;
    releaseKeys();
    sceneView.classList.add("ending");
    talkPrompt.classList.remove("show");
    edgeHint.classList.remove("show");
    const reduce = prefersReducedMotion();
    const at = (ms, fn) => endingTimers.push(setTimeout(fn, reduce ? Math.min(ms, 400 + ms * 0.25) : ms));

    const vr = sceneViewportEl.getBoundingClientRect();
    const fig = scene.objects.find(o => o.type === "core");
    const fr = fig.el.getBoundingClientRect();
    const cx = fr.left + fr.width / 2 - vr.left;
    const cy = fr.top + fr.height * 0.45 - vr.top;

    const trayLayers = layers.filter(l => l.key !== "self");
    const RING_R = [118, 92, 66, 42];
    // the rings and the orbit were sized for a figure ~125px tall; standing closer makes it
    // bigger, so the mandala grows with it and still circles the figure instead of cutting it
    const k = Math.min(Math.max(1, fr.height / 125), (vr.width / 2 - 10) / 140);
    const wrap = document.createElement("div");
    wrap.className = "self-ending";
    wrap.style.setProperty("--cx", cx + "px");
    wrap.style.setProperty("--cy", cy + "px");
    wrap.style.setProperty("--mk", k.toFixed(3));
    wrap.innerHTML = `
      <svg class="end-mandala" width="300" height="300" viewBox="-150 -150 300 300" aria-hidden="true">
        ${trayLayers.map((l, i) => {
          const r = RING_R[i], c = (2 * Math.PI * r).toFixed(1);
          return `<circle r="${r}" fill="none" stroke="${shade(l.light, 30)}" stroke-width="5" opacity="0.85"
                    stroke-dasharray="${c}" stroke-dashoffset="${c}" style="--len:${c}; animation-delay:${(1.5 + i * 0.25).toFixed(2)}s"/>`;
        }).join("")}
        <circle r="134" fill="none" stroke="rgba(255,240,200,0.7)" stroke-width="1.2" stroke-dasharray="2 7" class="end-outer"/>
        ${[0, 45, 90, 135].map(a => `<line x1="0" y1="-140" x2="0" y2="140" transform="rotate(${a})" stroke="rgba(255,240,200,0.28)" stroke-width="0.8" class="end-ray"/>`).join("")}
      </svg>
      <div class="end-orbit" aria-hidden="true"></div>
      <div class="end-wash" aria-hidden="true"></div>
      <div class="end-text" role="status" aria-live="polite">
        <p class="end-line l1">자신을 알기 위해, 혹은 찾기 위해<br>당신은 용기 내어 이 여정을 시작했습니다.<br>그리고 이제, 모든 조각이 하나로 모여 셀프에 닿았습니다.</p>
        <p class="end-line l2">셀프는 이 여정의 중심이자 전부였고,<br>처음부터 밖이 아닌 당신 안에 있었습니다.</p>
        <p class="end-line l3">당신은 지금 그대로,<br>온전하고 충분합니다.</p>
        <button class="end-continue">여정 돌아보기</button>
      </div>
      <button class="end-skip">건너뛰기 ›</button>
    `;
    sceneViewportEl.appendChild(wrap);
    const orbit = wrap.querySelector(".end-orbit");
    const finish = () => {
      if (!scene || scene.ended) return;
      clearSelfEnding();
      completeScene();
    };
    wrap.querySelector(".end-continue").onclick = finish;
    const showFinal = () => {
      endingTimers.forEach(clearTimeout);
      endingTimers = [];
      wrap.classList.add("s-ring", "s-gone", "s-wash", "s-l1", "s-l2", "s-l3", "s-btn");
      sceneViewportEl.querySelectorAll(".guide-inner").forEach(g => g.classList.add("gone")); if (USE3D && Forest3D.world) Forest3D.world.guidesGone();
      wrap.querySelector(".end-skip").remove();
      wrap.querySelector(".end-continue").focus({ preventScroll: true });
    };
    wrap.querySelector(".end-skip").onclick = showFinal;

    Sound.swell();
    wrap.classList.add("s-glow");
    // tokens fly in from each guide and take up an orbit around the figure
    trayLayers.forEach((l, i) => {
      const color = state.items && state.items[l.key];
      const g = sceneViewportEl.querySelector(`.guide-inner[data-key="${l.key}"]`);
      if (!color || !g) return;
      const gr = g.getBoundingClientRect();
      const sx = gr.left + gr.width / 2 - vr.left - cx, sy = gr.top + gr.height * 0.35 - vr.top - cy;
      const ang = (-90 + i * 90) * Math.PI / 180;
      const ex = Math.cos(ang) * 78 * k, ey = Math.sin(ang) * 78 * k;
      const tk = document.createElement("div");
      tk.className = "end-token";
      tk.innerHTML = layerTokenMarkup(l.key, color);
      tk.style.transform = `translate(${ex}px, ${ey}px)`;
      orbit.appendChild(tk);
      if (!reduce){
        tk.animate([
          { transform: `translate(${sx}px, ${sy}px) scale(0.6)`, opacity: 0 },
          { transform: `translate(${sx}px, ${sy - 24}px) scale(1.25)`, opacity: 1, offset: 0.25 },
          { transform: `translate(${ex}px, ${ey}px) scale(1)`, opacity: 1 }
        ], { duration: 1300, delay: 300 + i * 220, easing: "cubic-bezier(.5,0,.25,1)", fill: "backwards" });
      }
    });
    at(1500, () => wrap.classList.add("s-ring"));
    at(2300, () => wrap.classList.add("s-spin"));
    at(3300, () => { wrap.classList.add("s-gone"); sceneViewportEl.querySelectorAll(".guide-inner").forEach(g => g.classList.add("gone")); if (USE3D && Forest3D.world) Forest3D.world.guidesGone(); });
    at(4000, () => { wrap.classList.add("s-wash"); Sound.gather(); });
    at(5200, () => wrap.classList.add("s-l1"));
    at(9200, () => wrap.classList.add("s-l2"));
    at(12600, () => wrap.classList.add("s-l3"));
    at(14400, () => showFinal());
  }


  /* ---------------- rain (shadow layer) ----------------
     Individual drops on a canvas rather than a sliding stripe pattern (which read as rows of
     identical slashes hanging in the air). Every drop has its own position, length, speed and
     brightness across three depths — far drops short, slow and faint; near ones long, fast and
     clear — falling almost straight down with only a slight, slowly shifting wind, and each
     one ends in a small splash at its own spot on the ground. Stopping fades it out. */
  const Rain = (() => {
    const cv = document.getElementById("rainCanvas");
    const cx = cv.getContext("2d");
    let drops = [], splashes = [], raf = null, alpha = 0, target = 0, last = 0, W = 0, H = 0, dpr = 1;
    const DEPTH = [
      { len: [7, 12], speed: [0.42, 0.55], a: [0.18, 0.3], w: 0.8, land: [0.56, 0.68] },
      { len: [13, 20], speed: [0.7, 0.9], a: [0.28, 0.42], w: 1.1, land: [0.62, 0.85] },
      { len: [22, 34], speed: [1.05, 1.35], a: [0.38, 0.55], w: 1.5, land: [0.78, 1.02] }
    ];
    const rnd = (r) => r[0] + Math.random() * (r[1] - r[0]);
    function resize(){
      const r = cv.getBoundingClientRect();
      dpr = Math.min(2, window.devicePixelRatio || 1);
      W = Math.max(1, r.width); H = Math.max(1, r.height);
      cv.width = Math.round(W * dpr); cv.height = Math.round(H * dpr);
      cx.setTransform(dpr, 0, 0, dpr, 0, 0);
    }
    function makeDrop(fresh){
      const d = Math.random() < 0.45 ? 0 : Math.random() < 0.6 ? 1 : 2;
      const k = DEPTH[d];
      const drop = { d, x: Math.random() * (W + 40) - 20, len: rnd(k.len), speed: rnd(k.speed), a: rnd(k.a), w: k.w,
                     landY: rnd(k.land) * H };
      drop.y = fresh ? Math.random() * drop.landY : -drop.len - Math.random() * H * 0.3;
      return drop;
    }
    function frame(now){
      raf = requestAnimationFrame(frame);
      const dt = Math.min(40, now - (last || now));
      last = now;
      alpha += (target - alpha) * Math.min(1, dt / 900);
      if (target === 0 && alpha < 0.01){ alpha = 0; cx.clearRect(0, 0, W, H); cancelAnimationFrame(raf); raf = null; return; }
      const wind = Math.sin(now / 2600) * 0.05 + 0.03;      // a little sideways drift, slowly changing
      cx.clearRect(0, 0, W, H);
      cx.lineCap = "round";
      for (const p of drops){
        p.y += p.speed * dt;
        p.x += p.speed * wind * dt;
        if (p.y >= p.landY){
          if (target > 0 && Math.random() < 0.55) splashes.push({ x: p.x, y: p.landY, t: 0, d: p.d });
          Object.assign(p, makeDrop(false));
          continue;
        }
        const g = cx.createLinearGradient(p.x, p.y - p.len, p.x, p.y);
        g.addColorStop(0, `rgba(205,210,255,0)`);
        g.addColorStop(1, `rgba(215,220,255,${(p.a * alpha).toFixed(3)})`);
        cx.strokeStyle = g;
        cx.lineWidth = p.w;
        cx.beginPath();
        cx.moveTo(p.x - p.len * wind, p.y - p.len);
        cx.lineTo(p.x, p.y);
        cx.stroke();
      }
      // splashes: a tiny ring that widens and fades where each drop lands
      for (let i = splashes.length - 1; i >= 0; i--){
        const sp = splashes[i];
        sp.t += dt;
        const life = 320 + sp.d * 80;
        if (sp.t > life){ splashes.splice(i, 1); continue; }
        const q = sp.t / life;
        const rx = (1.5 + sp.d * 1.8) + q * (4 + sp.d * 4.5);
        cx.strokeStyle = `rgba(215,220,255,${((1 - q) * (0.2 + sp.d * 0.08) * alpha).toFixed(3)})`;
        cx.lineWidth = 0.8 + sp.d * 0.2;
        cx.beginPath();
        cx.ellipse(sp.x, sp.y, rx, rx * 0.28, 0, 0, Math.PI * 2);
        cx.stroke();
      }
    }
    return {
      start(){
        resize();
        const n = Math.round(Math.min(170, Math.max(70, W / 6)));
        drops = Array.from({ length: n }, () => makeDrop(true));
        splashes = [];
        target = 1;
        if (prefersReducedMotion()){
          // still frame: a few faint drops, no motion
          alpha = 0.6; cx.clearRect(0, 0, W, H);
          drops.forEach(p => { cx.strokeStyle = `rgba(215,220,255,${(p.a * 0.6).toFixed(3)})`; cx.lineWidth = p.w;
            cx.beginPath(); cx.moveTo(p.x, p.y - p.len); cx.lineTo(p.x, p.y); cx.stroke(); });
          return;
        }
        last = 0;
        if (!raf) raf = requestAnimationFrame(frame);
      },
      stop(now){
        target = 0;
        if (now || prefersReducedMotion()){
          if (raf) cancelAnimationFrame(raf);
          raf = null; alpha = 0; cx.clearRect(0, 0, W, H);
        }
      }
    };
  })();
  window.addEventListener("resize", () => { if (sceneViewportEl.classList.contains("raining")) Rain.start(); });

  function showEdgeHint(msg, ms){
    edgeHint.textContent = msg;
    edgeHint.classList.add("show");
    clearTimeout(showEdgeHint._t);
    showEdgeHint._t = setTimeout(() => edgeHint.classList.remove("show"), ms || 1800);
  }

  // shared by both the multiple-choice path and the free-text path: record the answer,
  // remember the first question's choice (that's what becomes the item/insight for this
  // layer), then either show the next question or finish up with the door
  function advanceQuestion(layer, total, frag, choiceIdx, picks, customText){
    // assigned by question index, never pushed: re-entering a layer, a refresh mid-dialogue
    // or stepping out and back can no longer pile up duplicate fragments
    ["answers", "picks", "custom"].forEach(f => {
      if (!state[f]) state[f] = {};
      if (!Array.isArray(state[f][layer.key])) state[f][layer.key] = [];
    });
    state.answers[layer.key][scene.qIndex] = frag;
    state.picks[layer.key][scene.qIndex] = picks || [];
    state.custom[layer.key][scene.qIndex] = customText || "";
    if (scene.qIndex === 0 && choiceIdx != null){
      if (!state.items) state.items = {};
      if (!state.choiceIdx) state.choiceIdx = {};
      if (!state.choiceId) state.choiceId = {};
      state.items[layer.key] = MASK_PALETTE[choiceIdx % MASK_PALETTE.length];
      state.choiceIdx[layer.key] = choiceIdx;
      const opt = layer.questions[0].options[choiceIdx];
      state.choiceId[layer.key] = opt && opt.id ? opt.id : null;
      if (layer.key === "anima"){ state.animaForm = state.choiceId.anima; refreshAnimaGuide(!!ANIMA_FORMS[state.animaForm]); }
    }
    save();
    scene.qIndex++;
    if (scene.qIndex < total){
      renderQuestion();
    } else if (layer.key === "persona"){
      // before the guide lifts its own mask, you shape yours from what you just said
      showMaskWorkshop(layer, () => finishDialogue(layer));
    } else {
      finishDialogue(layer);
    }
  }

  // the conversation is over: the guide responds and the door to the next layer appears
  function finishDialogue(layer){
    if (!scene || scene.answered) return;
    {
      scene.answered = true;
      revealGuide(layer.key);
      closeOverlay();
      talkPrompt.classList.remove("show");
      // the token you just earned becomes a literal key: a door in that color appears
      // ahead, and walking up to it is what actually carries you into the next layer
      const doorColor = (state.items && state.items[layer.key]) || MASK_PALETTE[0];
      const doorZ = scene.npcZ + (USE3D ? 9 * K3 : 260);
      if (USE3D) Forest3D.world.showDoor(doorZ / K3, doorColor);
      const doorObj = makeObj({
        type: "door", x: 0, z: doorZ, width: 100, height: 170, anchor: "bottom",
        html: doorMarkup(doorColor)
      });
      doorObj.el.classList.add("door");
      scene.objects.push(doorObj);
      scene.doorZ = doorZ;
      scene.dirty = true;
      Sound.chime();
      // the threshold into the anima layer is also the step from the personal unconscious
      // into the collective one — worth one line of orientation
      const nextKey = layers[scene.idx + 1] && layers[scene.idx + 1].key;
      const doorHint = () => showEdgeHint(nextKey === "anima"
        ? "이 문 너머는 개인의 기억을 넘어선, 모두가 함께 지닌 마음의 층(집단무의식)이에요"
        : "당신의 표식이 문의 열쇠가 됩니다 — 걸어 들어가 보세요", 3200);
      // after the persona guide lifts its mask, let that moment's line be read first
      if (layer.key === "persona" || layer.key === "shadow"){ const sc = scene; setTimeout(() => { if (scene === sc) doorHint(); }, 2700); }
      else if (layer.key === "anima" && scene.pool){
        // the reflection and the bridge come first; then where the bridge leads
        const sc = scene;
        setTimeout(() => { if (scene === sc) showEdgeHint("달빛 징검다리를 건너, 마음의 중심으로 걸어가 보세요", 3400); }, prefersReducedMotion() ? 3700 : 4500);
      }
      else doorHint();
    }
  }

  /* ---------------- 나만의 가면 (persona) ----------------
     The persona layer's answers become a mask: the expression comes from the first answer
     (which face you show), the pattern from the second (when it goes on), and the color seen
     through the eye holes from the third (what's underneath). Color and pattern can be
     changed. Then you take it off and set it down — it stays on the ground in the forest,
     still yours, just no longer on your face. */
  const MASK_DECOS = [
    { id: "dots", name: "점무늬" }, { id: "lines", name: "줄무늬" }, { id: "stars", name: "별" },
    { id: "flowers", name: "꽃" }, { id: "none", name: "없음" }
  ];
  // what's under the mask (persona Q3, by position): tired / wanting to be understood /
  // afraid of being alone / at ease
  const MASK_LININGS = ["#8fa3c0", "#e8a0a8", "#b9a0d8", "#f4d58d"];
  function maskFromAnswers(){
    const p = (state.picks && state.picks.persona) || [];
    const first = (arr) => (Array.isArray(arr) && arr.length ? arr[0] : 3);
    return {
      expr: layerChoiceId("persona") || "custom",
      deco: ["dots", "lines", "stars", "none"][first(p[1])] || "none",
      lining: MASK_LININGS[first(p[2])] || MASK_LININGS[3],
      color: (state.items && state.items.persona) || MASK_PALETTE[0]
    };
  }
  let maskIdSeq = 0;
  // a full-face Venetian masquerade mask (volto): an oval face in the chosen color with a
  // gold rim, gilded filigree around the eyes, a sculpted nose and closed lips, a plume on
  // top. What changes with the answers: the eyes and lips (the face you show), extra
  // touches per mask type, the pattern, and the color seen through the eye holes.
  function customMaskSVG(m){
    const c = m.color, dk = shade(c, -48), lt = shade(c, 60), GOLD = "#e9c46a", GOLD_DK = "#a87b2a";
    const uid = "mk" + (maskIdSeq++);
    const face = "M60,12 C93,12 108,38 108,70 C108,108 86,138 60,142 C34,138 12,108 12,70 C12,38 27,12 60,12 Z";
    const rim = "M60,18 C88,18 102,40 102,70 C102,104 82,131 60,135 C38,131 18,104 18,70 C18,40 32,18 60,18 Z";
    const EY = 64;
    // eyes: s = +1 left eye, -1 right eye (mirrored); slightly larger than the old eye-mask
    const eye = (cx, s) => {
      const X = dx => (cx + s * dx).toFixed(1), cy = EY;
      switch (m.expr){
        case "smile": return `M${X(-12)},${cy + 3} Q${cx},${cy - 12} ${X(12)},${cy + 3} Q${cx},${cy - 2} ${X(-12)},${cy + 3} Z`;
        case "cool": return `M${X(-12)},${cy - 2} L${X(12)},${cy - 2} Q${X(11)},${cy + 8} ${cx},${cy + 8} Q${X(-11)},${cy + 8} ${X(-12)},${cy - 2} Z`;
        case "strong": return `M${X(-12)},${cy - 5} Q${cx},${cy - 6} ${X(12)},${cy + 3} Q${cx},${cy + 10} ${X(-12)},${cy - 5} Z`;
        case "hedgehog": return `M${cx - 7},${cy} a7,7 0 1,0 14,0 a7,7 0 1,0 -14,0 Z`;
        case "owl": return `M${cx - 12},${cy} a12,12 0 1,0 24,0 a12,12 0 1,0 -24,0 Z`;
        case "martyr": return `M${X(-12)},${cy + 4} Q${cx},${cy - 8} ${X(12)},${cy - 2} Q${cx},${cy + 7} ${X(-12)},${cy + 4} Z`;
        case "invisible": return `M${X(-11)},${cy} Q${cx},${cy - 4} ${X(11)},${cy} Q${cx},${cy + 4} ${X(-11)},${cy} Z`;
        default: return `M${X(-13)},${cy} Q${cx},${cy - 10} ${X(13)},${cy} Q${cx},${cy + 10} ${X(-13)},${cy} Z`; // almond
      }
    };
    const eyes = [eye(42, 1), eye(78, -1)];
    // closed lips — the expression of the face you show
    const LIPS = {
      smile: "M48,112 Q60,122 72,112 Q60,117 48,112 Z",
      joker: "M44,110 Q60,126 76,110 Q60,119 44,110 Z",
      pleaser: "M50,113 Q60,120 70,113 Q60,116 50,113 Z",
      strong: "M49,116 Q60,110 71,116 Q60,114 49,116 Z",
      martyr: "M51,115 Q60,111 69,115 Q60,113.5 51,115 Z",
      hedgehog: "M54,114 Q60,116 66,114 Q60,115 54,114 Z",
      invisible: "M54,114 L66,114",
      cool: "M50,114 L70,114",
      capable: "M50,114 L70,114"
    };
    const lips = LIPS[m.expr] || "M51,113 Q60,117 69,113 Q60,115 51,113 Z";
    const lipsSvg = lips.includes("Z")
      ? `<path d="${lips}" fill="${shade(c, -30)}" stroke="#161018" stroke-width="1.3" stroke-linejoin="round"/>`
      : `<path d="${lips}" stroke="#161018" stroke-width="1.6" stroke-linecap="round"/>`;
    // gilded filigree around each eye and a jewel on the brow
    const swirl = (cx, s) => {
      const X = dx => (cx + s * dx).toFixed(1);
      return `<path d="M${X(-15)},${EY - 4} Q${X(-17)},${EY - 16} ${X(-4)},${EY - 18} Q${X(8)},${EY - 19} ${X(15)},${EY - 10}
                 M${X(15)},${EY + 4} Q${X(10)},${EY + 14} ${X(-2)},${EY + 13} Q${X(-10)},${EY + 12} ${X(-11)},${EY + 7}

    const optsEl = card.querySelector(".options");
    card.querySelector("#dlgPauseBtn").onclick = pauseDialogue;
    card.querySelector("#dlgInfoBtn").onclick = () => showInfo(layer);

    optsEl.classList.toggle("masked", layer.key === "persona");
    const selected = new Set();
    const customIdx = q.options.findIndex(o => o.custom);
    let customInput = null;

    const updateConfirmState = () => {
      let ok = selected.size > 0;
      if (ok && customIdx !== -1 && selected.has(customIdx)){
        ok = customInput.value.trim().length > 0;
      }
      confirmBtn.disabled = !ok;
    };

    const confirmBtn = document.createElement("button");
    confirmBtn.className = "primary-btn";
    confirmBtn.textContent = "다음";
    confirmBtn.disabled = true;
    confirmBtn.onclick = () => {
      const idxList = [...selected].sort((a, b) => a - b);
      const frag = idxList.map(i => {
        const opt = q.options[i];
        if (!opt.custom) return opt.frag;
        const t = customInput.value.trim();
        const ending = hasBatchim(t) ? "이라는" : "라는";
        // each custom option can supply its own phrasing (a mask isn't a feeling isn't a
        // shadow trait) — fall back to the original emotion-shaped wording if it doesn't
        return opt.fragTemplate ? opt.fragTemplate(t, ending) : `"${t}"${ending} 감정을 안고 걷던 나`;
      }).join(", ");
      if (scene.qIndex === 0) scene.branchId = q.options[idxList[0]].id || null;
      const typed = customIdx !== -1 && selected.has(customIdx) ? customInput.value.trim() : "";
      if (typed && checkCrisis(typed)) showSupport(true);
      advanceQuestion(layer, total, frag, idxList[0], idxList, typed);
    };
    q.options.forEach((opt, i) => {
      const btn = document.createElement("button");
      if (layer.key === "persona"){
        btn.innerHTML = `${maskIconMarkup(MASK_PALETTE[i % MASK_PALETTE.length])}<span>${opt.text}</span>`;
      } else {
        btn.textContent = opt.text;
      }
      // options are toggles now — 마음이 여러 갈래일 수 있으니, 하나만 고르지 않아도 된다
      btn.setAttribute("aria-pressed", "false");
      btn.onclick = () => {
        btn.classList.toggle("selected");
        const isSelected = btn.classList.contains("selected");
        btn.setAttribute("aria-pressed", String(isSelected));
        // the guide listening: a soft smile as soon as something is chosen
        const portrait = card.querySelector(".npc-portrait");
        if (portrait) setTimeout(() => portrait.classList.toggle("pleased", selected.size > 0), 0);
        if (isSelected) selected.add(i); else selected.delete(i);
        if (opt.custom && customInput){
          customInput.hidden = !isSelected;
          if (isSelected) customInput.focus();
        }
        updateConfirmState();
      };
      optsEl.appendChild(btn);
    });
    // a long list (the persona's 12 masks) is split over two pages, so it doesn't all land
    // at once; picks are kept while paging back and forth
    const optBtns = [...optsEl.querySelectorAll("button")];
    let pageCount = 1, showPage = null;
    if (optBtns.length > 8){
      pageCount = 2;
      const per = q.pageSplit || Math.ceil(optBtns.length / 2);
      const [prevLabel, nextLabel] = q.pagerLabels || (layer.key === "persona" ? ["← 앞의 가면", "다른 가면 더 보기 →"] : ["← 앞으로", "더 보기 →"]);
      optBtns.forEach((b, i) => { b.dataset.page = i < per ? "0" : "1"; });
      const pager = document.createElement("div");
      pager.className = "opt-pager";
      pager.innerHTML = `<button type="button" class="text-link pg-prev">${prevLabel}</button>
        <span class="pg-num" aria-live="polite"></span>
        <button type="button" class="text-link pg-next">${nextLabel}</button>`;
      showPage = (n, focus) => {
        optBtns.forEach(b => { b.hidden = b.dataset.page !== String(n); });
        if (customInput) customInput.hidden = n !== 1 || !selected.has(customIdx);
        pager.querySelector(".pg-prev").style.visibility = n === 0 ? "hidden" : "visible";
        pager.querySelector(".pg-next").style.visibility = n === 1 ? "hidden" : "visible";
        const other = optBtns.filter((b, i) => b.dataset.page !== String(n) && selected.has(i)).length;
        pager.querySelector(".pg-num").textContent = `${n + 1} / 2` + (other ? ` · 다른 쪽에서 ${other}개 고름` : "");
        if (focus){ const f = optBtns.find(b => !b.hidden); if (f) f.focus({ preventScroll: true }); }
      };
      pager.querySelector(".pg-prev").onclick = () => showPage(0, true);
      pager.querySelector(".pg-next").onclick = () => showPage(1, true);
      optsEl.appendChild(pager);
    }
    if (customIdx !== -1){
      customInput = document.createElement("input");
      customInput.type = "text";
      customInput.className = "free-text custom-emotion-input";
      customInput.placeholder = q.options[customIdx].placeholder || "직접 적어보세요...";
      customInput.hidden = true;
      customInput.addEventListener("input", updateConfirmState);
      optsEl.insertBefore(customInput, optsEl.querySelector(".opt-pager"));
    }
    optsEl.appendChild(confirmBtn);
    if (showPage) showPage(0, false);
  }

  // the guide's response once the conversation is done: the persona guide lifts its mask
  // (what was under the face you show), every guide smiles
  function revealGuide(key){
    if (!scene || !scene.npcObj) return;
    if (key === "shadow"){
      // having faced it, the rain eases off and the air clears a little
      sceneViewportEl.classList.remove("raining");
      Rain.stop(false);
      sceneViewportEl.classList.add("after-rain");
      if (USE3D) Forest3D.world.clearRain();
      sceneViewportEl.style.setProperty("--vig-clear", USE3D ? "52%" : "34%");
      Sound.stopRain();
      showEdgeHint("비가 그쳤어요. 마주하고 나니, 공기가 조금 가벼워졌어요", 2600);
    }
    if (key === "anima" && scene.pool) layMoonBridge();
    const el = scene.npcObj.el;
    el.classList.add("pleased");
    if (key === "persona"){
      el.classList.add("unmasked");
      if (USE3D) Forest3D.world.liftMask();
      const sp = document.createElement("div");
      sp.className = "unmask-sparkle";
      el.appendChild(sp);
      setTimeout(() => sp.remove(), 1600);
      showEdgeHint("가면 아래, 맑은 눈이 당신을 바라봐요", 2600);
    }
  }

  // after the anima conversation, stepping stones of moonlight lay themselves toward the
  // pool and the guide: the anima/animus as the bridge to what lies deeper
  function layMoonBridge(){
    const sc = scene;
    const reduce = prefersReducedMotion();
    if (USE3D){
      setTimeout(() => {
        if (scene !== sc) return;
        Forest3D.world.moonBridge();
        Sound.swell();
        showEdgeHint("당신이 끌렸던 그 모습은, 당신 안에도 있었어요", 3400);
      }, reduce ? 200 : 900);
      return;
    }
    setTimeout(() => {
      if (scene !== sc) return;
      // stepping stones of moonlight drawn in perspective on the ground, from your feet to the
      // guide's: big and near at the bottom, smaller toward the horizon, laid one by one
      // they stop at the pool's near edge, so the water itself is the last step
      const rr = sceneViewportEl.getBoundingClientRect();
      const pr = sc.pool.el.getBoundingClientRect();
      const roadTop = rr.top + rr.height * 0.56, roadH = rr.height * 0.44;
      const cutoff = Math.max(4, (pr.bottom - roadTop) / roadH * 100 - 4);
      let stones = "", shown = 0;
      for (let k = 0; k < 14; k++){
        const d = 1 + k * 0.55;                       // depth of the k-th stone
        const cy = 100 / d - 6 / d;                   // distance below the horizon shrinks with depth
        const rx = 26 / d + 1.2, ry = 4.6 / d + 0.5;
        const cx = 50 + Math.sin(k * 1.4) * 7 / d;    // a slight wander, like real stepping stones
        if (cy - ry < cutoff) break;
        const delay = shown++;
        stones += `<ellipse cx="${cx.toFixed(2)}" cy="${cy.toFixed(2)}" rx="${rx.toFixed(2)}" ry="${ry.toFixed(2)}" fill="url(#mrStone)"
                     style="animation-delay:${reduce ? 0 : (delay * 0.22).toFixed(2)}s"/>`;
      }
      moonRoad.innerHTML = `<svg viewBox="0 0 100 100" preserveAspectRatio="none" width="100%" height="100%">
        <defs><radialGradient id="mrStone" cx="50%" cy="45%" r="55%">
          <stop offset="0%" stop-color="#fff8dc" stop-opacity="0.95"/><stop offset="45%" stop-color="#f6dc9a" stop-opacity="0.75"/>
          <stop offset="80%" stop-color="#d8b8ff" stop-opacity="0.25"/><stop offset="100%" stop-color="#d8b8ff" stop-opacity="0"/>
        </radialGradient></defs>${stones}</svg>`;
      sceneViewportEl.classList.add("bridge");
      sc.dirty = true;
      Sound.swell();
      showEdgeHint("당신이 끌렸던 그 모습은, 당신 안에도 있었어요", 3400);
    }, reduce ? 200 : 900);
  }

  function openDialogue(){
    Sound.blip();
    scene.qIndex = 0;
    resetLayerAnswers(scene.layer.key);
    renderQuestion();
    openOverlay("dialogue");
  }

  function tryTalk(){
    // the dialogue overlay being open must block this too — otherwise Space mid-conversation
    // restarted the questions from 1 while the answers already given stayed recorded
    if (!scene || scene.isSelf || scene.answered || anyOverlayOpen()) return;
    const distToNpc = scene.npcZ - scene.traveled;
    if (distToNpc < TALK_DIST) openDialogue();
    else showEdgeHint(`조금 더 다가가면 ${scene.layer.npcName}와 이야기할 수 있어요`);
  }

  function completeScene(){
    if (!scene || scene.ended) return;
    scene.ended = true;
    const idx = scene.idx;
    clearTimeout(sceneTransitionTimer);
    if (idx === layers.length - 1){
      state.step = layers.length;
      state.completedAt = Date.now();
      save();
      sceneTransitionTimer = setTimeout(() => { leaveScene(); showSynthesis(1); }, 250);
    } else {
      state.step = idx + 1;
      save();
      renderMap(); // keep the (hidden) map in sync even though we're skipping straight past it
      // walk through the door into the next layer directly, instead of bouncing back out to
      // the map in between — the whole point was for this to feel like one continuous journey.
      // The timer is cancelled by leaveScene, so pressing "← 지도로" in this gap can't yank
      // you back into a scene while the map is showing.
      sceneTransitionTimer = setTimeout(() => { sceneTransitionTimer = null; enterScene(idx + 1); }, 250);
    }
  }

  // leaving after the conversation but before walking through the door means this layer's
  // answers will be asked again next time — say so instead of silently discarding them
  function requestLeaveScene(){
    if (scene && !scene.isSelf && scene.answered && !scene.doorTriggered){
      if (!confirm("아직 문을 지나지 않았어요. 지금 지도로 돌아가면 이 층의 대화를 다시 하게 돼요. 돌아갈까요?")) return;
    }
    leaveScene();
  }

  // "잠시 멈추기": step out of the conversation without answering. The layer is simply
  // asked again from the start next time you talk (answers are stored per question, so
  // nothing is duplicated).
  function pauseDialogue(){
    if (!scene || !overlay.classList.contains("dialogue-mode")) return;
    resetLayerAnswers(scene.layer.key);
    save();
    closeOverlay();
    showEdgeHint("괜찮아요. 준비되면 다시 말을 걸어 주세요");
    btnTalk.focus({ preventScroll: true });
  }
  function resetLayerAnswers(key){
    ["answers", "picks", "custom"].forEach(f => { if (state[f]) delete state[f][key]; });
    if (key === "anima" && state.animaForm){ state.animaForm = null; refreshAnimaGuide(false); }
  }

  // the guide is first only a dim, blurred shape far down the path; it sharpens and takes on
  // its colors as you walk closer, and is fully itself by talking distance. The first time
  // it can be made out, one quiet line says someone is there. Returns an opacity factor.
  const REVEAL_FAR = 2100, REVEAL_NEAR = 520;
  function revealNpc(dist){
    const npc = scene.npcObj;
    const t = scene.answered ? 1 : Math.max(0, Math.min(1, (REVEAL_FAR - dist) / (REVEAL_FAR - REVEAL_NEAR)));
    const k = t * t * (3 - 2 * t); // smoothstep: lingers as a silhouette, then comes in
    const q = Math.round(k * 50) / 50;
    if (q !== npc.revealQ){
      npc.revealQ = q;
      if (USE3D) Forest3D.world.setReveal(q);
      npc.el.style.filter = q >= 1 ? "" :
        `brightness(${(0.22 + 0.78 * q).toFixed(2)}) saturate(${(0.25 + 0.75 * q).toFixed(2)}) blur(${(2.6 * (1 - q)).toFixed(2)}px)`;
    }
    if (!scene.glimpsed && t > 0.06 && !obstacleBlocks() && !edgeHint.classList.contains("show")){
      scene.glimpsed = true;
      if (scene.layer.glimpse) showEdgeHint(scene.layer.glimpse, 2800);
    }
    return 0.3 + 0.7 * k;
  }

  function loop(now){
    rafId = requestAnimationFrame(loop);
    const dt = Math.max(0, Math.min(40, now - lastTime));
    lastTime = now;
    if (USE3D){ loop3D(now, dt); return; }
    if (!scene || overlay.classList.contains("open") || infoOverlay.classList.contains("open")) return;
    if (scene.ending) return; // the ending plays on its own; the world holds still beneath it

    let cap = scene.isSelf ? (SELF_Z - SELF_STOP) : (scene.answered ? (scene.npcZ + 500) : (scene.npcZ - WALL_MARGIN));
    const blocked = obstacleBlocks();
    if (blocked) cap = Math.min(cap, scene.obs.z - 150);
    const moving = keys.forward && scene.traveled < cap;

    // ease speed toward its target instead of snapping, so starting/stopping feels smooth.
    // At the Self, steps slow down over the last stretch — arriving should feel unhurried.
    let targetSpeed = moving ? SPEED : 0;
    if (scene.isSelf && moving) targetSpeed *= Math.max(0.32, Math.min(1, (cap - scene.traveled) / 420));
    scene.speed += (targetSpeed - scene.speed) * Math.min(1, dt / 220);
    if (Math.abs(scene.speed) < 0.002) scene.speed = 0;

    if (scene.speed > 0.2 && now - (scene.lastStepAt || 0) > 430){ scene.lastStepAt = now; Sound.step(); }
    if (scene.speed > 0){
      const before = scene.traveled;
      scene.traveled = Math.min(cap, scene.traveled + scene.speed * dt);
      if (!scene.isSelf && !scene.answered && !blocked && scene.traveled >= cap - 1 && before < cap - 1){
        if (now - scene.lastHintAt > 1400){
          scene.lastHintAt = now;
          showEdgeHint(`먼저 ${scene.layer.npcName}와 이야기를 나눠보세요`);
        }
      }
    }

    // ease look rotation instead of snapping between -16 / 0 / 16 (wide enough to actually
    // look at the things placed along the path)
    const targetLook = keys.lookL ? -16 : keys.lookR ? 16 : 0;
    scene.lookAngle += (targetLook - scene.lookAngle) * Math.min(1, dt / 200);

    // walk-bob: phase advances only while actually moving, amplitude eases in/out —
    // avoids the jump-cut you'd get from sampling Math.sin(performance.now()) on start/stop
    const bobTarget = scene.speed > 0.03 ? 1 : 0;
    scene.bobAmp += (bobTarget - scene.bobAmp) * Math.min(1, dt / 260);
    scene.bobPhase += dt * (0.35 + scene.speed * 0.5);
    const bobY = prefersReducedMotion() ? 0 : Math.sin(scene.bobPhase / 130) * 2.4 * scene.bobAmp;

    // ground and objects move by the exact same amount — the ground panel is deliberately
    // oversized past its clipping frame (see .fp-ground/.fp-ground-clip) so this never exposes
    // empty space at an edge
    const totalYpx = `${bobY.toFixed(2)}px`;
    if (!scene.isSelf) updateObstacles(dt, now);

    // nothing moved since last frame (standing still, not turning, bob settled): skip every
    // per-object style write — standing in a scene used to rewrite ~50 transforms per frame
    const L = scene.last;
    const still = !scene.dirty && Math.abs(scene.traveled - L.traveled) < 0.01
      && Math.abs(scene.lookAngle - L.look) < 0.005 && Math.abs(bobY - L.bob) < 0.005;
    if (still){ checkTriggers(); return; }
    L.traveled = scene.traveled; L.look = scene.lookAngle; L.bob = bobY;
    scene.dirty = false;
    fpWorld.style.transform = `rotateY(${scene.lookAngle.toFixed(2)}deg)`;
    fpBob.style.transform = `translateY(${totalYpx})`;
    fpGround.style.transform = `translateY(${totalYpx})`;
    // ground speckle drifts toward you as you walk, so the floor reads as moving too
    fpGround.style.backgroundPosition = `0 ${((scene.traveled * 0.3) % 18).toFixed(1)}px, 0 0, 0 0, 0 0`;

    // the layer's own time of day deepens as you walk in
    const span = scene.isSelf ? SELF_Z : scene.npcZ;
    const skyT = Math.min(1, scene.traveled / span);
    if (Math.abs(skyT - scene.lastSkyT) > 0.004){
      scene.lastSkyT = skyT;
      fpSky2.style.opacity = skyT.toFixed(3);
      if (scene.isSelf) sceneViewportEl.style.setProperty("--sun-y", (26 - skyT * 46).toFixed(1) + "px");
      sceneRaysEl.style.opacity = (scene.atm.rays[0] + (scene.atm.rays[1] - scene.atm.rays[0]) * skyT).toFixed(3);
    }

    scene.objects.forEach(obj => {
      if (obj.removed) return;
      const zLeft = obj.z - scene.traveled;
      if (zLeft < -90){
        if (!obj.hidden){ obj.el.style.display = "none"; obj.hidden = true; }
        return;
      }
      if (obj.hidden){ obj.el.style.display = "block"; obj.hidden = false; }
      const anchorY = obj.anchor === "center" ? "-50%" : "-100%";
      // measured pixel-perfect (0px gap) against the ground in devtools, yet it still visibly
      // read as a gap on screen — so sink ground-anchored objects a bit *into* the ground on
      // purpose rather than merely touching it. A few px of overlap into an opaque, blurred-edge
      // shadow is invisible; a few px of gap is not.
      const groundSink = obj.anchor === "bottom" ? 14 : 0;
      const isTree = obj.type === "bush";
      // trees step aside as you reach them (like walking past them on a real path), so they
      // leave through the edges of the view instead of fading out in front of you
      let x = obj.x;
      if (isTree){ const near = Math.max(0, Math.min(1, (380 - zLeft) / 380)); x = obj.x * (1 + near * near * 0.75); }
      obj.el.style.transform = `translate3d(${x.toFixed(1)}px, ${obj.y + groundSink}px, ${-zLeft}px) translate(-50%, ${anchorY})`;
      // dissolve smoothly as you pass an object instead of an abrupt display:none pop —
      // a hard cut right as something is large and close reads as "it vanished", not "I walked past it"
      let op = zLeft > 20 ? 1 : Math.max(0, (zLeft + 90) / 110);
      if (isTree){
        // a longer, eased fade as they pass, a soft focus blur up close, and a gentle fade-in
        // far away so distant trees come out of the haze instead of popping in
        const t = Math.max(0, Math.min(1, (zLeft + 70) / 250));
        const far = Math.max(0, Math.min(1, (3500 - zLeft) / 700));
        op = t * t * (3 - 2 * t) * (0.25 + 0.75 * far);
        const blur = zLeft < 200 ? Math.round((1 - Math.max(0, zLeft) / 200) * 6) / 2 : 0;
        if (blur !== obj.blur){ obj.blur = blur; obj.el.style.filter = blur ? `blur(${blur}px)` : ""; }
      }
      if (obj === scene.npcObj) op *= revealNpc(zLeft);
      if (obj.appearAt != null) op *= Math.max(0, Math.min(1, (scene.traveled - obj.appearAt) / 320));
      obj.el.style.opacity = op;
      if (obj.type === "bush"){
        obj.el.classList.toggle("rustle", Math.abs(zLeft) < 140);
      }
    });

    // the moon sits in the sky behind the guide: follow the guide's on-screen x (one rect
    // read per moving frame, anima scene only)
    if (scene.pool && scene.npcObj){
      const r = scene.npcObj.el.getBoundingClientRect(), vr = sceneViewportEl.getBoundingClientRect();
      const gx = `translateX(${(r.left + r.width / 2 - vr.left - vr.width / 2).toFixed(1)}px)`;
      fpMoon.style.transform = gx;
      moonRoad.style.transform = gx;
    }

    checkTriggers(true);
  }

  // talk prompt, door and Self arrival — cheap, so they run even on frames that skip the
  // object writes; the prompt's screen position is only re-measured when the view moved
  function checkTriggers(viewMoved){
    if (!scene) return;
    if (!scene.isSelf){
      const distToNpc = scene.npcZ - scene.traveled;
      const npcObj = scene.npcObj;
      const show = distToNpc < TALK_DIST && distToNpc > -80 && !scene.answered;
      talkPrompt.classList.toggle("show", show);
      if (show && !scene.greeted && npcObj){
        scene.greeted = true;
        npcObj.el.classList.add("greet");
        setTimeout(() => npcObj.el.classList.remove("greet"), 1800);
      }
      if (show !== scene.talkReady){
        scene.talkReady = show;
        btnTalk.classList.toggle("near", show);
        btnTalk.classList.toggle("far", !show);
        btnTalk.setAttribute("aria-label", show ? `${scene.layer.npcName}에게 말 걸기` : "말 걸기 (안내자에게 더 다가가야 해요)");
      }
      if (show && viewMoved && npcObj && npcObj.el){
        const r = npcObj.el.getBoundingClientRect();
        const vr = sceneViewportEl.getBoundingClientRect();
        talkPrompt.style.left = (r.left + r.width/2 - vr.left) + "px";
        talkPrompt.style.top = (r.top - vr.top) + "px";
      }
      if (scene.doorZ && !scene.doorTriggered && scene.traveled >= scene.doorZ - 40){
        scene.doorTriggered = true;
        const doorObj = scene.objects.find(o => o.type === "door");
        if (doorObj) doorObj.el.classList.add("door-opening");
        if (USE3D) Forest3D.world.openDoor();
        Sound.swell();
        sceneFlashEl.classList.add("show");
        setTimeout(completeScene, prefersReducedMotion() ? 150 : 550);
      }
    } else {
      if (scene.traveled >= (scene.selfEnd != null ? scene.selfEnd : SELF_Z - SELF_STOP) - 2) startSelfEnding();
    }
  }

  // game keys only apply while actually walking a scene with nothing open on top. Anything
  // typed into a text box, IME composition, or a focused button (Enter/Space = click) is left
  // completely alone — previously this listener swallowed w/a/d, Space and Enter everywhere.
  function isTypingTarget(el){
    return !!(el && el.closest && el.closest("input, textarea, select, [contenteditable]"));
  }
  function anyOverlayOpen(){
    return overlay.classList.contains("open") || infoOverlay.classList.contains("open");
  }
  window.addEventListener("keydown", (e) => {
    if (e.isComposing || e.keyCode === 229) return;
    if (e.key === "Escape"){ handleEscape(); return; }
    if (isTypingTarget(e.target)) return;
    if (!scene || anyOverlayOpen()) return;
    if (["ArrowUp","w","W"].includes(e.key)){ keys.forward = true; e.preventDefault(); }
    if (["ArrowLeft","a","A"].includes(e.key)){ keys.lookL = true; e.preventDefault(); }
    if (["ArrowRight","d","D"].includes(e.key)){ keys.lookR = true; e.preventDefault(); }
    if (USE3D && ["ArrowDown","s","S"].includes(e.key)){ keys.back = true; e.preventDefault(); }
    if (USE3D && ["v","V"].includes(e.key) && !e.repeat) toggleSelfView();
    const onButton = e.target && e.target.closest && e.target.closest("button, [role='button']");
    if (USE3D && e.code === "Space" && !onButton){
      e.preventDefault();
      if (e.repeat) return;
      const near = !scene.isSelf && !scene.answered && scene.npcZ - scene.traveled < TALK_DIST;
      if (near) tryTalk(); else if (!scene.ending && Forest3D.world) Forest3D.world.jump();
      return;
    }

  /* ---------------- sound (synthesized with Web Audio — no audio files) ----------------
     Off by default (a classroom demo shouldn't suddenly make noise); the toggle is the user
     gesture browsers require before any audio can start.
     What makes it feel "mysterious" rather than a flat hum is mostly space: everything runs
     through a long, generated reverb. On top of that, each layer has
       · a slow pad — soft detuned voices holding a chord that drifts to the next one every
         ~11s, with a filter that slowly opens and closes,
       · sparse bell / music-box notes picked at random from the layer's scale, panned around
         and left to ring out into the reverb,
       · a faint high shimmer,
     each layer in its own key and colour (bright at the persona, darker and stranger at the
     shadow, dreamy lydian at the anima, radiant at the Self), plus wind, and surf at the Self.
     Footsteps, the door chime, the swell and the gathering light share the same reverb. */
  const Sound = (() => {
    let ctx = null, master = null, verbIn = null, analyser = null, amb = null, enabled = false, current = null;
    const hz = (root, semi) => root * Math.pow(2, semi / 12);
    const MOODS = {
      map:     { root: 146.83, chords: [[0, 7, 14, 17], [-2, 5, 12, 17], [-5, 2, 9, 14]], bells: [0, 2, 7, 9, 12], bellOct: 2, bellEvery: [3.5, 7], cut: [500, 1400], wind: 0.008, shimmer: 0.006 },
      persona: { root: 130.81, chords: [[0, 7, 11, 16], [5, 9, 16, 19], [-3, 7, 12, 16], [2, 9, 14, 17]], bells: [0, 2, 4, 7, 9, 12], bellOct: 2, bellEvery: [2.6, 5.5], cut: [700, 2000], wind: 0.012, shimmer: 0.008 },
      ego:     { root: 110, chords: [[0, 7, 10, 15], [5, 8, 12, 19], [3, 10, 14, 19], [-2, 5, 10, 14]], bells: [0, 3, 5, 7, 10, 12], bellOct: 2, bellEvery: [3, 6], cut: [600, 1600], wind: 0.011, shimmer: 0.006 },
      shadow:  { root: 92.5, chords: [[0, 7, 12, 15], [1, 8, 13, 16], [0, 6, 12, 15], [-2, 5, 10, 13]], bells: [0, 1, 6, 7, 12, 13], bellOct: 2, bellEvery: [5, 10], cut: [280, 800], wind: 0.012, shimmer: 0, rain: true },
      anima:   { root: 164.81, chords: [[0, 7, 11, 18], [2, 9, 14, 18], [-1, 6, 11, 16], [4, 11, 16, 23]], bells: [0, 2, 4, 6, 7, 11, 12], bellOct: 1, bellEvery: [2.4, 5], cut: [600, 1800], wind: 0.009, shimmer: 0.01 },
      self:    { root: 146.83, chords: [[0, 7, 14, 16], [5, 12, 16, 21], [7, 14, 19, 23], [-3, 4, 12, 16]], bells: [0, 2, 4, 7, 9, 12, 14], bellOct: 2, bellEvery: [2.2, 4.5], cut: [900, 2600], wind: 0.003, shimmer: 0.012, waves: true }

      master = ctx.createGain();

      };

        const pan = ctx.createStereoPanner ? ctx.createStereoPanner() : null;
        const bg = ctx.createGain(); bg.gain.value = 0;
        const peak = key === "shadow" ? 0.05 : 0.07;
        bg.gain.setValueAtTime(0, t);
        bg.gain.linearRampToValueAtTime(peak, t + 0.008);
        bg.gain.exponentialRampToValueAtTime(0.0001, t + 3.2);
        [[1, 1], [2.0, 0.35], [3.01, 0.18], [4.2, 0.07]].forEach(([mult, amp]) => {

          o.connect(og); og.connect(bg); o.start(t); o.stop(t + 3.4);
        });

        else route(bg, 0.25, 0.75);

          const o2 = ctx.createOscillator(); o2.type = "sine"; o2.frequency.value = f * 2;
          const g2 = ctx.createGain(); g2.gain.setValueAtTime(0, t + 0.45);
          g2.gain.linearRampToValueAtTime(peak * 0.35, t + 0.46); g2.gain.exponentialRampToValueAtTime(0.0001, t + 2.6);

        }

        const shg = ctx.createGain(); shg.gain.value = m.shimmer;
        const tl = ctx.createOscillator(); tl.frequency.value = 0.3;
        const tlg = ctx.createGain(); tlg.gain.value = m.shimmer * 0.8;

        const rn2 = ctx.createBufferSource(); rn2.buffer = noise; rn2.loop = true; rn2.playbackRate.value = 0.7;
        const bp = ctx.createBiquadFilter(); bp.type = "bandpass"; bp.frequency.value = 420; bp.Q.value = 0.8;
        const g2 = ctx.createGain(); g2.gain.value = 0.6;
        rn2.connect(bp); bp.connect(g2); g2.connect(rainGain);
        rn.start(); rn2.start(0, 0.7);
        nodes.push(rn, rn2);
      }
      if (m.waves){
        const sn = ctx.createBufferSource(); sn.buffer = noise; sn.loop = true;
        const sf = ctx.createBiquadFilter(); sf.type = "lowpass"; sf.frequency.value = 650;
        const sg = ctx.createGain(); sg.gain.value = 0.035;
        const sl = ctx.createOscillator(); sl.frequency.value = 0.12;
        const slg = ctx.createGain(); slg.gain.value = 0.032;
        sl.connect(slg); slg.connect(sg.gain);

        const wlg = ctx.createGain(); wlg.gain.value = 260;
        wl.connect(wlg); wlg.connect(wf.frequency);
        wn.connect(wf); wf.connect(wg); wg.connect(out);

      <div class="about-section">
        <h3>어떤 프로그램인가요?</h3>
        <p>분석심리학자 카를 융이 그린 &lsquo;마음의 지도&rsquo;를 따라, 마음의 가장 바깥에서 중심까지 한 걸음씩 걸어 들어가 보는 디지털 자기성찰 여정이에요.</p>
        <p>다섯 겹의 숲을 차례로 지나며 각 층의 안내자와 대화하고, 질문에 답하면서 그동안 잘 보지 못했던 나의 조각들을 모아요. 마지막엔 모은 조각들을 하나로 엮어 지금의 나를 돌아보게 돼요.</p>
        <p>정답을 맞히는 시험이 아니라, 나를 조금 더 다정하게 들여다보는 시간이에요.</p>
      </div>
      <div class="about-section">
        <h3>심리학 배경 — 융의 분석심리학</h3>
        <p>카를 구스타프 융(1875–1961)은 스위스의 정신의학자로, 마음을 의식과 개인 무의식, 그리고 인류가 함께 지닌 집단 무의식의 여러 층으로 보았어요.</p>
        <p>융은 이 모든 부분을 알아가고 받아들여 온전한 내가 되어가는 과정을 <b>개성화(Individuation)</b>라고 불렀어요. 이 여정은 그 과정을 다섯 겹의 원으로 옮겨 놓은 것이에요.</p>
        <ul class="about-layers">
          ${layers.map(l => `<li>${l.icon} <b>${l.name}</b> — ${ABOUT_LAYER_SUMMARY[l.key] || ""}</li>`).join("")}
        </ul>
      </div>
      <div class="about-section">
        <h3>이 여정이 전하고 싶은 말</h3>
        <p><b>나를 찾기 위해 멀리 갈 필요는 없어요. 나는 이미 내 안에 다 있어요.</b></p>
        <p>융에게 &lsquo;자기(Self)&rsquo;는 밖에서 얻거나 애써 만들어야 하는 것이 아니라, 처음부터 마음 안에 있는 중심이에요. 그래서 이 여정은 무언가를 찾아 떠나는 길이 아니라, 이미 내 안에 있던 나를 알아보는 길이에요.</p>
      </div>
      <p class="onboard-note">이 체험은 심리검사나 진단·치료를 대신하지 않아요. 각 층의 ⓘ 버튼을 누르면 개념 설명을 다시 볼 수 있어요.</p>
      <div class="about-actions">
        <button class="text-link" id="aboutAvatarBtn">내 캐릭터 고르기</button>
        <button class="info-close-btn" id="infoCloseBtn">알겠어요</button>
      </div>
    `;
    infoCard.querySelector("#aboutAvatarBtn").addEventListener("click", () => {
      const back = infoReturnFocus;
      showOnboarding();
      infoReturnFocus = back;
    });
    openInfoOverlay();
    infoCard.scrollTop = 0;
  }
  document.getElementById("aboutBtn").addEventListener("click", showAbout);
  document.getElementById("helpBtn").addEventListener("click", () => showSupport(false));
  document.getElementById("clearDataBtn").addEventListener("click", () => {
    if (!confirm("이 기기에 저장된 여정 기록을 모두 지울까요? 보관된 지난 여정도 함께 지워지고, 되돌릴 수 없어요.")) return;
    try{ localStorage.removeItem(STORAGE_KEY); }catch(e){}
    state = Object.assign(freshState(), { onboarded: true });
    save();
    document.querySelector('circle.self-core').classList.remove('bloom');
    renderMap();
    showToast("기록을 지웠어요.");
  });


  initStars();
  let moteTimer = null;
  function startMotes(){
    if (moteTimer || prefersReducedMotion()) return;
    moteTimer = startMoteStream(document.getElementById("moteLayer"), { minSize: 2, maxSize: 4, minDur: 9, maxDur: 16, every: 1400 });
  }
  function stopMotes(){ clearInterval(moteTimer); moteTimer = null; }
  startMotes();
  initSceneMotes();
  syncInert();
  renderMap();
  if (!state.onboarded) setTimeout(showOnboarding, 500);
  // sound was on last time: browsers still need a fresh gesture, so arm it for the first one
  if (state.soundOn){
    const arm = (e) => {
      if (e.target === soundBtn) return; // that click is the toggle itself
      window.removeEventListener("pointerdown", arm);
      window.removeEventListener("keydown", arm);
      if (!Sound.enabled){ Sound.setEnabled(true); syncSoundBtn(); }
    };
    window.addEventListener("pointerdown", arm);
    window.addEventListener("keydown", arm);
  }
})();
</script>
</body>
</html>
