<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>마음숲 모험 — 심리학자 칼 융의 마음 지도를 따라 나를 찾아가는 길</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Jua&family=Gowun+Dodum&display=swap" rel="stylesheet">
<style>
  :root{
    --bg: #0c1016;
    --card-bg: #171522;
    --text: #f1ece2;
    --text-dim: #b8b2c4;
    --gold: #f4d58d;
  }
  *{ box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
  /* the page itself darkens as you go deeper, and warms to gold once you reach the Self */
  @property --depth{ syntax: "<color>"; inherits: true; initial-value: #131820; }
  body{ --depth: #131820; }
  body[data-step="2"]{ --depth: #100d1a; }
  body[data-step="3"]{ --depth: #1a1226; }
  body[data-step="4"]{ --depth: #1f1b14; }
  body[data-step="5"]{ --depth: #2a2214; }
  body{
    margin: 0;
    min-height: 100vh;
    min-height: 100dvh;
    background: radial-gradient(ellipse at center, var(--depth) 0%, #0a0d13 70%, #05060a 100%);
    transition: --depth 2s ease;
    color: var(--text);
    font-family: "Gowun Dodum", "Malgun Gothic", sans-serif;
    display: flex;
    flex-direction: column;
    align-items: center;
    padding: 2rem 1rem 3rem;
    overflow-x: hidden;
    word-break: keep-all;
    overflow-wrap: anywhere;
  }
  /* only the "game" surfaces block text selection — what you wrote and read stays copyable */
  .stage, .scene-viewport, .touch-controls{ user-select: none; -webkit-user-select: none; }
  :focus-visible{ outline: 2px solid var(--gold); outline-offset: 3px; }
  circle.ring:focus{ outline: none; }
  circle.ring:focus-visible{ stroke: var(--gold); stroke-width: 4; }
  h1.title{
    font-family: "Jua", sans-serif;
    font-size: 1.9rem;
    letter-spacing: 1px;
    margin: 0 0 0.2rem;
    text-align: center;
    color: var(--gold);
    text-shadow: 0 0 18px rgba(244, 213, 141, 0.35);
  }
  h1.title .title-tag{
    display: block;
    margin-top: 0.25rem;
    font-family: "Gowun Dodum", "Malgun Gothic", sans-serif;
    font-size: 0.8rem;
    letter-spacing: 0.5px;
    color: rgba(244,213,141,0.7);
    text-shadow: none;
  }
  p.subtitle{
    color: var(--text-dim);
    margin: 0 0 1.6rem;
    text-align: center;
    font-size: 0.95rem;
    max-width: 420px;
    line-height: 1.5;
  }
  .hidden{ display: none !important; }

  /* ---------- AMBIENCE (stars / fog / motes) ---------- */
  #starfield{
    position: fixed; inset: 0; z-index: 0; pointer-events: none; overflow: hidden;
  }
  #starfield .star{
    position: absolute;
    width: 2px; height: 2px;
    border-radius: 50%;
    background: #fff;
    animation: twinkle ease-in-out infinite;
  }
  @keyframes twinkle{
    0%, 100% { opacity: var(--min-op, 0.15); transform: scale(1); }
    50% { opacity: var(--max-op, 0.9); transform: scale(1.6); }
  }
  #fogLayer{
    position: fixed; inset: -10% -10%; z-index: 0; pointer-events: none;
    overflow: hidden; mix-blend-mode: screen; opacity: 0.5;
  }
  #fogLayer .fog-blob{
    position: absolute;
    width: 60vmax; height: 60vmax;
    border-radius: 50%;
    filter: blur(60px);
    opacity: 0.35;
  }
  #fogLayer .fog-a{
    top: -10%; left: -15%;
    background: radial-gradient(circle, rgba(122,59,110,0.5), transparent 70%);
    animation: driftA 38s ease-in-out infinite;
  }
  #fogLayer .fog-b{
    bottom: -20%; right: -15%;
    background: radial-gradient(circle, rgba(47,109,116,0.45), transparent 70%);
    animation: driftB 46s ease-in-out infinite;
  }
  @keyframes driftA{ 0%,100%{ transform: translate(0,0) scale(1);} 50%{ transform: translate(6vw,4vh) scale(1.15);} }
  @keyframes driftB{ 0%,100%{ transform: translate(0,0) scale(1);} 50%{ transform: translate(-5vw,-6vh) scale(1.1);} }

  #moteLayer{ position: fixed; inset: 0; z-index: 1; pointer-events: none; overflow: hidden; }
  .mote{
    position: absolute;
    bottom: -10px;
    border-radius: 50%;
    background: radial-gradient(circle, rgba(244,213,141,0.9), rgba(244,213,141,0));
    animation: floatUp linear forwards;
  }
  @keyframes floatUp{
    0% { transform: translate(0,0) scale(0.6); opacity: 0; }
    10% { opacity: var(--mote-op, 0.75); }
    90% { opacity: var(--mote-op, 0.75); }
    100% { transform: translate(var(--drift,0px), -110vh) scale(1); opacity: 0; }
  }

  h1.title, p.subtitle, #mapView, #sceneView, .overlay{ position: relative; z-index: 2; }

  /* ---------- MAP VIEW ---------- */
  #mapView{ display: flex; flex-direction: column; align-items: center; }
  .stage{
    position: relative;
    width: min(92vw, 560px);
    aspect-ratio: 1 / 1;
  }
  svg{ width: 100%; height: 100%; display: block; overflow: visible; }

  circle.ring{
    cursor: default;
    transition: filter 0.5s ease, opacity 0.5s ease, transform 0.4s ease;
    transform-origin: 300px 300px;
  }
  circle.ring.locked{ filter: grayscale(0.85) brightness(0.55); }
  circle.ring.active{ cursor: pointer; animation: pulse 2.6s ease-in-out infinite; }
  circle.ring.active:hover{ filter: brightness(1.15); }
  circle.ring.done{ filter: saturate(0.8) brightness(0.9); }
  circle.ring.shake{ animation: shake 0.4s ease; }
  @keyframes pulse{
    0%, 100% { filter: brightness(1) drop-shadow(0 0 0px rgba(244,213,141,0)); }
    50% { filter: brightness(1.12) drop-shadow(0 0 22px rgba(244,213,141,0.45)); }
  }
  @keyframes shake{
    0%, 100% { transform: translate(0,0); }
    25% { transform: translate(-4px,0); }
    75% { transform: translate(4px,0); }
  }
  circle.self-core.bloom{ animation: bloom 3.2s ease-in-out infinite; }
  @keyframes bloom{
    0%, 100% { filter: brightness(1) drop-shadow(0 0 10px rgba(255,246,224,0.5)); }
    50% { filter: brightness(1.25) drop-shadow(0 0 40px rgba(255,246,224,0.85)); }
  }

  /* magic-circle rim + orbiting sparks on the active ring */
  circle.ring-rim{
    fill: none;
    stroke: transparent;
    pointer-events: none;
    transition: stroke 0.5s ease, opacity 0.5s ease;
    transform-origin: 300px 300px;
  }
  circle.ring-rim.active{
    stroke: rgba(244,213,141,0.75);
    stroke-width: 1.4;
    stroke-dasharray: 3 10;
    animation: rimSpin 22s linear infinite;
    filter: drop-shadow(0 0 6px rgba(244,213,141,0.55));
  }
  circle.ring-rim.done{
    stroke: rgba(244,213,141,0.4);
    stroke-width: 1;
  }
  @keyframes rimSpin{ to { stroke-dashoffset: -260; } }

  g.ring-orbit{
    opacity: 0;
    transition: opacity 0.6s ease;
    transform-origin: 300px 300px;
    pointer-events: none;
  }
  g.ring-orbit.active{
    opacity: 1;
    animation: orbitSpin 9s linear infinite;
  }
  g.ring-orbit .spark{
    r: 3.2px;
    fill: var(--gold);
    filter: url(#glow-soft);
  }
  @keyframes orbitSpin{ to { transform: rotate(360deg); } }

  .map-avatar{
    position: absolute;
    width: 30px;
    height: 41px;
    transform: translate(-50%,-100%);
    transition: left 0.9s cubic-bezier(.65,0,.35,1), top 0.9s cubic-bezier(.65,0,.35,1);
    z-index: 5;
    filter: drop-shadow(0 4px 6px rgba(0,0,0,0.55));
    pointer-events: none;
  }

  .progress{ display: flex; gap: 0.5rem; margin-top: 1.4rem; }
  .progress .dot{
    width: 9px; height: 9px; border-radius: 50%;
    background: #6b6488;
    transition: background 0.4s ease, transform 0.4s ease;
  }
  .progress .dot.done{ background: var(--gold); }
  .progress .dot.active{ background: #fff; transform: scale(1.3); }

  /* item tray: one slot per guide, filled with the mask-colored token earned from them —
     collecting all four is what it takes to stand before the Self at the center */
  .item-tray{ display: flex; gap: 0.6rem; margin-top: 1rem; }
  .item-slot{
    width: 38px; height: 26px;
    border-radius: 8px;
    border: 1.5px dashed rgba(255,255,255,0.38);
    display: flex; align-items: center; justify-content: center;
    background: rgba(255,255,255,0.03);
    transition: transform 0.3s ease, border-color 0.3s ease;
  }
  .item-slot.filled{
    border-style: solid;
    border-color: rgba(244,213,141,0.35);
    background: rgba(244,213,141,0.06);
    animation: itemPop 0.4s ease;
  }
  .item-slot svg{ width: 30px; height: 20px; }
  @keyframes itemPop{ 0%{ transform: scale(0.4); } 60%{ transform: scale(1.15); } 100%{ transform: scale(1); } }

  .ring-label{
    margin-top: 1.2rem;
    text-align: center;
    color: var(--text-dim);
    font-size: 0.88rem;
    min-height: 1.3em;
  }
  .ring-label-group{ display: flex; align-items: center; justify-content: center; gap: 0.5rem; }
  .ring-label-group .ring-label{ margin-top: 0; }

  .info-btn{
    position: relative;
    flex: 0 0 auto;
    width: 22px; height: 22px;
    border-radius: 50%;
    border: 1px solid rgba(244,213,141,0.4);
    background: rgba(244,213,141,0.1);
    color: var(--gold);
    font-size: 0.75rem;
    line-height: 1;
    cursor: pointer;
    display: inline-flex; align-items: center; justify-content: center;
    font-family: "Jua", sans-serif;
    transition: background 0.2s ease, transform 0.2s ease;
  }
  .info-btn:hover{ background: rgba(244,213,141,0.25); transform: scale(1.08); }
  /* the visible dot stays small, but the tap target is a full 44px */
  .info-btn::before{ content: ""; position: absolute; inset: -11px; }

  .reopen-btn{
    margin-top: 1.4rem;
    background: none;
    border: 1px solid rgba(244,213,141,0.4);
    color: var(--gold);
    padding: 0.55rem 1.1rem;
    border-radius: 999px;
    cursor: pointer;
    font-family: inherit;
    font-size: 0.85rem;
  }

  /* shared chibi walk-cycle (used by NPCs, dialogue portrait, map avatar) */
  .leg{ transform-box: fill-box; transform-origin: 50% 0%; }
  .walking .leg-l{ animation: walkL 0.36s linear infinite; }
  .walking .leg-r{ animation: walkR 0.36s linear infinite; }
  .walking .body-bounce{ animation: bob 0.36s linear infinite; }
  @keyframes walkL{ 0%,100%{ transform: rotate(22deg);} 50%{ transform: rotate(-22deg);} }
  @keyframes walkR{ 0%,100%{ transform: rotate(-22deg);} 50%{ transform: rotate(22deg);} }
  @keyframes bob{ 0%,100%{ transform: translateY(0);} 50%{ transform: translateY(-3px);} }
  /* arms swing opposite the same-side leg, like a natural gait */
  .arm{ transform-box: fill-box; transform-origin: 50% 0%; }
  .walking .arm-l{ animation: armL 0.36s linear infinite; }
  .walking .arm-r{ animation: armR 0.36s linear infinite; }
  @keyframes armL{ 0%,100%{ transform: rotate(-15deg);} 50%{ transform: rotate(15deg);} }
  @keyframes armR{ 0%,100%{ transform: rotate(15deg);} 50%{ transform: rotate(-15deg);} }
  /* a slow, subtle breathing scale for characters standing idle — applied to an inner
     wrapper, never the element a script is positioning directly (see idle-breathe usage) */
  .idle-breathe{ animation: idleBreathe 3.4s ease-in-out infinite; transform-box: fill-box; transform-origin: 50% 100%; }
  @keyframes idleBreathe{ 0%,100%{ transform: scaleY(1); } 50%{ transform: scaleY(1.018); } }
  .npc-aura{ animation: auraPulse 2s ease-in-out infinite; }
  @keyframes auraPulse{ 0%,100%{ opacity: 0.35; r: 24; } 50%{ opacity: 0.7; r: 27; } }
  .idle-sway{ animation: idleSway 2.6s ease-in-out infinite; transform-box: fill-box; transform-origin: 50% 100%; }
  @keyframes idleSway{ 0%,100%{ transform: rotate(-2deg);} 50%{ transform: rotate(2deg);} }
  .chibi-eyes{ transform-box: fill-box; transform-origin: 50% 50%; animation: blink 4.5s ease-in-out infinite; }
  @keyframes blink{ 0%, 92%, 100% { transform: scaleY(1); } 96% { transform: scaleY(0.1); } }
  .chibi-shadow{ transition: opacity 0.3s ease; }

  /* ---------- SCENE (FIRST-PERSON CORRIDOR) VIEW ---------- */
  /* the 3D scene: the world fills the window, the controls float over it */
  #view3d, #anchors3d, .ctrl.ctrl-3d{ display: none; }
  body.scene3d{ padding: 0; overflow: hidden; }
  body.scene3d h1.title, body.scene3d p.subtitle{ display: none; }
  body.scene3d #sceneView:not(.hidden){ position: fixed; inset: 0; width: 100%; height: 100%; display: block; z-index: 2; }
  body.scene3d .scene-viewport{ position: absolute; inset: 0; width: 100%; height: 100%; max-height: none; border: 0; border-radius: 0; box-shadow: none; perspective: none; }
  body.scene3d #view3d{ position: absolute; inset: 0; width: 100%; height: 100%; display: block; z-index: 0; touch-action: none; cursor: grab; }
  body.scene3d #anchors3d{ display: block; position: absolute; inset: 0; visibility: hidden; pointer-events: none; }
  .anchor3d{ position: absolute; pointer-events: none; }
  body.scene3d .fp-sky, body.scene3d .scene-rays, body.scene3d .fp-sun, body.scene3d .fp-moon, body.scene3d .fp-sea,
  body.scene3d .fp-ground-clip, body.scene3d .fp-horizon-fog, body.scene3d .fp-world, body.scene3d .moon-road, body.scene3d .fp-motes{ display: none !important; }
  body.scene3d .scene-hud{ position: absolute; left: 16px; right: 16px; top: 14px; width: auto; margin: 0; z-index: 9; pointer-events: none; justify-content: flex-start; }
  body.scene3d .scene-hud > *{ pointer-events: auto; }
  body.scene3d .back-btn, body.scene3d .scene-title-group{ background: rgba(23,21,34,0.55); border: 1px solid rgba(244,213,141,0.22); backdrop-filter: blur(10px); -webkit-backdrop-filter: blur(10px); }
  body.scene3d .scene-title-group{ padding: 0.32rem 0.8rem; border-radius: 999px; }
  body.scene3d .scene-hint{ position: fixed; right: 18px; bottom: 26px; color: rgba(241,236,226,0.82); text-shadow: 0 1px 6px rgba(0,0,0,0.6); pointer-events: none; }
  body.scene3d .edge-hint{ top: 70px; }
  body.scene3d .touch-controls{ position: absolute; left: 50%; bottom: max(14px, env(safe-area-inset-bottom)); transform: translateX(-50%); width: auto; margin: 0; gap: 0.5rem; padding: 0.5rem 0.8rem; border-radius: 999px; z-index: 9;
    background: rgba(23,21,34,0.5); border: 1px solid rgba(244,213,141,0.22); backdrop-filter: blur(10px); -webkit-backdrop-filter: blur(10px); }
  body.scene3d .ctrl.ctrl-3d{ display: flex; flex-direction: column; align-items: center; }
  #btnView.near{ border-color: var(--gold); box-shadow: 0 0 14px rgba(244,213,141,0.5); }
  @media (max-width: 480px){
    body.scene3d .touch-controls{ gap: 0.25rem; padding: 0.4rem 0.5rem; }
    body.scene3d .touch-controls button{ width: 44px; height: 44px; font-size: 1rem; }
    body.scene3d #btnForward{ width: 52px; height: 52px; }
    body.scene3d .ctrl-cap{ display: none; }
  }
  #sceneView{
    width: min(94vw, 860px);
    display: flex;
    flex-direction: column;
    align-items: center;
  }
  .scene-hud{
    display: flex;
    align-items: center;
    justify-content: space-between;
    width: 100%;
    margin-bottom: 0.7rem;
    gap: 0.6rem;
  }
  .back-btn{
    background: rgba(255,255,255,0.08);
    border: 1px solid rgba(255,255,255,0.18);
    color: var(--text);
    padding: 0.45rem 0.9rem;
    border-radius: 999px;
    font-family: "Jua", sans-serif;
    font-size: 0.85rem;
    cursor: pointer;
    flex: 0 0 auto;
  }
  .scene-title-group{ display: flex; align-items: center; justify-content: center; gap: 0.45rem; }
  .scene-title{
    font-family: "Jua", sans-serif;
    color: var(--gold);
    font-size: 1.05rem;
    text-align: center;
  }
  .scene-hint{
    color: var(--text-dim);
    font-size: 0.78rem;
    flex: 0 0 auto;
    text-align: right;
    white-space: nowrap;
  }

  .scene-viewport{
    position: relative;
    width: 100%;
    height: 400px;
    max-height: 58vh;
    border-radius: 18px;
    overflow: hidden;
    border: 3px solid rgba(244,213,141,0.25);
    box-shadow: 0 18px 50px rgba(0,0,0,0.55), inset 0 0 60px rgba(0,0,0,0.5);
    background: #111;
    perspective: 480px;
    perspective-origin: 50% 56%;
  }
  /* canopy vignette: darkens the edges so the view reads as hemmed in by overhanging
     foliage, without costing a single extra 3D object — strongest for dense-forest layers */
  .scene-viewport::after{
    content: "";
    position: absolute; inset: 0;
    z-index: 6;
    pointer-events: none;
    background: radial-gradient(ellipse at 50% 58%, transparent var(--vig-clear, 46%), var(--vig-color, rgba(0,0,0,0.5)) 100%);
  }
  .scene-viewport.dense .fp-horizon-fog{ opacity: 1.6; }
  .fp-sky2{ opacity: 0; }
  .fp-obj.decor svg{ filter: drop-shadow(0 0 7px rgba(255,240,210,0.35)); }
  .npc-halo{
    position: absolute; left: 50%; top: 58%;
    width: 190%; height: 150%;
    transform: translate(-50%, -50%);
    border-radius: 50%;
    background: radial-gradient(circle, var(--halo, rgba(255,250,235,0.45)) 0%, transparent 68%);
    pointer-events: none;
  }
  .scene-step{ color: var(--text-dim); font-size: 0.8rem; margin-left: 0.35rem; font-family: "Gowun Dodum", sans-serif; }
  .ring-name{ font-family: "Jua", sans-serif; font-size: 15px; fill: rgba(241,236,226,0.82); pointer-events: none;
    paint-order: stroke; stroke: rgba(0,0,0,0.45); stroke-width: 3px; letter-spacing: 1px; }
  .ring-name.dark{ fill: #5a4310; stroke: rgba(255,250,235,0.5); }
  /* pausing the page's ambient effects while walking: they're hidden behind the scene anyway */
  body.in-scene .star, body.in-scene .fog-blob{ animation-play-state: paused; }

  /* drifting pearlescent light motes inside the scene — cheap pure-CSS ambient magic dust */
  .fp-motes{ position: absolute; inset: 0; z-index: 7; overflow: hidden; pointer-events: none; }
  .fp-mote{
    position: absolute;
    bottom: -6%;
    border-radius: 50%;
    background: radial-gradient(circle, rgba(var(--mote-rgb, 235,255,245),0.95), rgba(var(--mote-rgb, 200,230,255),0.5) 45%, transparent 75%);
    animation: fpMoteDrift linear infinite;
  }
  @keyframes fpMoteDrift{
    0% { transform: translate(0, 0); opacity: 0; }
    12% { opacity: var(--mote-op, 0.75); }
    50% { transform: translate(var(--drift, 12px), -220px); }
    88% { opacity: var(--mote-op, 0.75); }
    100% { transform: translate(calc(var(--drift, 12px) * 2), -440px); opacity: 0; }
  }
  /* the door between layers: a slow ambient pulse while closed, a quick bright burst when
     you actually reach it and it "opens" */
  .fp-door-glow{ animation: doorPulse 2.2s ease-in-out infinite; transform-box: fill-box; transform-origin: 50% 50%; }
  @keyframes doorPulse{ 0%,100%{ opacity: 0.5; transform: scale(1); } 50%{ opacity: 1; transform: scale(1.18); } }
  .fp-obj.door-opening svg{ animation: doorBurst 0.55s ease forwards; }
  @keyframes doorBurst{ 0%{ filter: brightness(1); } 100%{ filter: brightness(3.5) saturate(0); opacity: 0; } }
  .scene-flash{
    position: absolute; inset: 0; z-index: 8;
    background: radial-gradient(circle, #fffaf0, #f4d58d 70%);
    opacity: 0;
    pointer-events: none;
  }
  .scene-flash.show{ animation: flashPulse 0.9s ease; }
  @keyframes flashPulse{ 0%{ opacity: 0; } 45%{ opacity: 1; } 100%{ opacity: 0; } }

  .fp-sky{ position: absolute; inset: 0; z-index: 0; filter: saturate(1.3); }
  .fp-horizon-fog{
    position: absolute; left: 0; right: 0; top: 38%; height: 20%;
    background: linear-gradient(to bottom, transparent, rgba(0,0,0,0.28));
    z-index: 1; pointer-events: none;
  }
  .scene-rays{
    position: absolute; inset: 0;
    z-index: 1;
    opacity: 0.45;
    background: repeating-conic-gradient(from 0deg at 50% 56%, rgba(255,255,255,0.10) 0deg 6deg, transparent 6deg 18deg);
    animation: spin 50s linear infinite;
  }
  @keyframes spin{ to { transform: rotate(360deg); } }

  .fp-world{
    position: absolute; inset: 0;
    transform-style: preserve-3d;
    z-index: 2;
  }
  .fp-bob{
    position: absolute; inset: 0;
    transform-style: preserve-3d;
  }
  /* the ground is a flat 2D backdrop (like .fp-sky), NOT a plane rotated into 3D — a rotated
     plane and the billboard objects standing on it use fundamentally different depth-to-screen
     math, so however carefully tuned, the two disagree at most distances and objects read as
     floating. A flat backdrop can never disagree with anything: it just sits behind every
     object, always, at every depth. */
  /* fixed clipping window: this is what actually defines "where the ground is" on screen, and
     it never moves. The bob/jump transform goes on the (oversized) .fp-ground panel inside it —
     sized 50px past this frame on top and bottom, so shifting it for a walk-bob or a jump never
     pulls its edge past the frame and exposes empty space behind. */
  .fp-ground-clip{
    position: absolute;
    left: 0; right: 0; top: 56%; bottom: 0;
    z-index: 1;
    overflow: hidden;
  }
  .fp-ground{
    position: absolute;
    left: 0; right: 0; top: -50px; bottom: -50px;
    filter: saturate(1.3);
  }
  #fpObjects{ position: absolute; inset: 0; transform-style: preserve-3d; }
  .fp-obj{
    position: absolute;
    left: 50%; top: 56%;
    transform-style: preserve-3d;
    backface-visibility: hidden;
  }
  .fp-obj .bush3d{ position: relative; width: 100%; height: 100%; }
  .fp-obj.rustle .bush3d{ animation: rustle 0.5s ease; }
  @keyframes rustle{ 0%,100%{ transform: scale(1) rotate(0deg);} 50%{ transform: scale(1.08) rotate(-3deg);} }
  .self-halo{
    position: absolute;
    left: 50%; top: 62%;
    width: 240%; height: 200%;
    transform: translate(-50%,-50%);
    border-radius: 50%;
    background: radial-gradient(circle, rgba(255,250,240,0.55) 0%, rgba(244,213,141,0.18) 55%, transparent 78%);
    filter: blur(4px);
  }
  .fp-obj.self-figure{
    animation: bloom 2.4s ease-in-out infinite;
    filter: drop-shadow(0 0 18px rgba(255,250,240,0.6));
  }

  .talk-prompt{
    position: absolute;
    z-index: 9;
    transform: translate(-50%, -100%);
    background: #fff;
    color: #1a1a1a;
    padding: 0.3rem 0.6rem;
    border-radius: 10px;
    font-size: 0.78rem;
    opacity: 0;
    transition: opacity 0.2s ease, transform 0.2s ease;
    white-space: nowrap;
    box-shadow: 0 4px 10px rgba(0,0,0,0.3);
  }
  .talk-prompt::after{
    content: "";
    position: absolute; left: 50%; bottom: -6px;
    transform: translateX(-50%);
    border: 6px solid transparent;
    border-top-color: #fff;
  }
  .talk-prompt.show{ opacity: 1; transform: translate(-50%, -115%); }

  .edge-hint{
    position: absolute;
    left: 50%; top: 14px;
    transform: translateX(-50%) translateY(-20px);
    background: rgba(0,0,0,0.7);
    color: var(--gold);
    padding: 0.4rem 0.9rem;
    border-radius: 999px;
    font-size: 0.82rem;
    z-index: 9;
    opacity: 0;
    transition: opacity 0.3s ease, transform 0.3s ease;
    pointer-events: none;
    white-space: nowrap;
  }
  .edge-hint.show{ opacity: 1; transform: translateX(-50%) translateY(0); }

  .touch-controls{
    display: flex;
    justify-content: center;
    align-items: center;
    width: 100%;
    margin-top: 0.8rem;
    gap: 0.8rem;
  }
  .touch-controls button{
    width: 54px; height: 54px;
    border-radius: 50%;
    border: 1px solid rgba(255,255,255,0.2);
    background: rgba(255,255,255,0.08);
    color: var(--text);
    font-size: 1.2rem;
    cursor: pointer;
  }
  .touch-controls button:active{ background: rgba(244,213,141,0.3); }
  /* captions are kept for screen readers only (aria-label); visually the row is the
     original single line of round buttons, so the page keeps its original height */
  .ctrl{ display: contents; }
  .ctrl-cap{ display: none; }
  #btnTalk.far{ opacity: 0.45; }
  #btnTalk.near{ animation: talkReady 1.6s ease-in-out infinite; }
  @keyframes talkReady{ 0%,100%{ box-shadow: 0 0 0 0 rgba(244,213,141,0.0); } 50%{ box-shadow: 0 0 0 6px rgba(244,213,141,0.25); } }
  #btnForward{ width: 66px; height: 66px; background: rgba(255,255,255,0.14); }
  #btnTalk{ background: rgba(244,213,141,0.18); border-color: rgba(244,213,141,0.5); }

  /* ---------- OVERLAY (dialogue + synthesis) ---------- */
  .overlay{
    position: fixed;
    inset: 0;
    background: rgba(4,5,8,0.68);
    backdrop-filter: blur(3px);
    display: flex;
    align-items: center;
    justify-content: center;
    padding: 1.2rem;
    opacity: 0;
    visibility: hidden;
    pointer-events: none;
    transition: opacity 0.35s ease, visibility 0s linear 0.35s;
    z-index: 10;
  }
  .overlay.open{ opacity: 1; visibility: visible; pointer-events: auto; transition: opacity 0.35s ease, visibility 0s; }

  .card{
    position: relative;
    background: linear-gradient(180deg, var(--card-bg), #100e18);
    border: 1px solid rgba(244,213,141,0.18);
    border-radius: 18px;
    max-width: 440px;
    width: 100%;
    max-height: calc(100vh - 2.4rem);
    max-height: calc(100dvh - 2.4rem);
    display: flex;
    flex-direction: column;
    overflow: hidden;
    transform: translateY(18px) scale(0.97);
    transition: transform 0.4s ease;
    box-shadow: 0 20px 60px rgba(0,0,0,0.5), 0 0 0 1px rgba(244,213,141,0.04);
  }
  .overlay.open .card{ transform: translateY(0) scale(1); }
  /* the card is a fixed frame (border + shimmer) and only this inner layer scrolls — with the
     frame itself scrolling, its decorative border scrolled away with the content and showed
     up as a second, cut-off border halfway down long cards */
  .card-scroll{
    flex: 1 1 auto;
    min-height: 0;
    padding: 1.8rem 1.6rem;
    overflow-y: auto;
    overflow-x: hidden;
    overscroll-behavior: contain;
  }
  .card::before{
    content: "";
    position: absolute; inset: 0;
    border-radius: inherit;
    padding: 1px;
    background: linear-gradient(120deg, rgba(244,213,141,0) 20%, rgba(244,213,141,0.55) 50%, rgba(244,213,141,0) 80%);
    background-size: 220% 220%;
    -webkit-mask: linear-gradient(#fff 0 0) content-box, linear-gradient(#fff 0 0);
    -webkit-mask-composite: xor;
    mask-composite: exclude;
    animation: cardShimmer 5s linear infinite;
    pointer-events: none;
  }
  @keyframes cardShimmer{ 0%{ background-position: 0% 0%; } 100%{ background-position: 220% 0%; } }
  .card::after{
    content: "✦";
    position: absolute; top: 10px; right: 14px;
    color: rgba(244,213,141,0.4);
    font-size: 0.85rem;
    animation: cornerTwinkle 3.2s ease-in-out infinite;
    pointer-events: none;
  }
  @keyframes cornerTwinkle{ 0%,100%{ opacity: 0.25; transform: scale(0.9); } 50%{ opacity: 0.9; transform: scale(1.15); } }
  .hat-spark{ transform-box: fill-box; transform-origin: 50% 50%; animation: cornerTwinkle 2.4s ease-in-out infinite; }
  .hanging-mask{ animation: maskSwing 3.6s ease-in-out infinite; }
  @keyframes maskSwing{ 0%,100%{ transform: rotate(-6deg); } 50%{ transform: rotate(6deg); } }
  .card-scroll > *{ animation: cardRise 0.5s ease both; }
  .card-scroll > *:nth-child(1){ animation-delay: 0.02s; }
  .card-scroll > *:nth-child(2){ animation-delay: 0.08s; }
  .card-scroll > *:nth-child(3){ animation-delay: 0.14s; }
  .card-scroll > *:nth-child(4){ animation-delay: 0.2s; }
  .card-scroll > *:nth-child(5){ animation-delay: 0.26s; }
  .card-scroll > *:nth-child(n+6){ animation-delay: 0.3s; }
  @keyframes cardRise{ from{ opacity: 0; transform: translateY(8px); } to{ opacity: 1; transform: translateY(0); } }

  /* the concept-explainer window: sits above the dialogue overlay so it can be opened
     mid-conversation too, without disturbing whatever the dialogue overlay is showing */
  .info-overlay{ z-index: 11; }
  .info-overlay .card{ max-width: 460px; }
  .info-explain{ color: var(--text); line-height: 1.7; font-size: 0.92rem; margin: 0 0 1.2rem; }
  .info-close-btn{
    display: block;
    margin-left: auto;
    background: rgba(244,213,141,0.14);
    border: 1px solid rgba(244,213,141,0.4);
    color: var(--gold);
    padding: 0.5rem 1.1rem;
    border-radius: 999px;
    cursor: pointer;
    font-family: "Jua", sans-serif;
    font-size: 0.85rem;
  }
  .info-close-btn:hover{ background: rgba(244,213,141,0.24); }

  .overlay.dialogue-mode{ align-items: flex-end; padding-bottom: 1.4rem; }
  .overlay.dialogue-mode .card{ max-width: 640px; }
  .overlay.dialogue-mode .card-scroll{
    display: flex;
    gap: 1rem;
    align-items: flex-start;
  }
  .npc-portrait{
    flex: 0 0 auto;
    width: 64px; height: 84px;
  }
  .dialogue-body{ flex: 1 1 auto; }

  .badge{
    display: inline-block;
    font-size: 0.8125rem;
    color: var(--gold);
    letter-spacing: 1px;
    margin-bottom: 0.6rem;
    padding: 0.24rem 0.7rem;
    border-radius: 999px;
    background: rgba(244,213,141,0.1);
    border: 1px solid rgba(244,213,141,0.3);
    box-shadow: 0 0 12px rgba(244,213,141,0.15);
  }
  .card h2{ font-family: "Jua", sans-serif; margin: 0 0 0.6rem; font-size: 1.25rem; }
  .card .desc{ color: var(--text-dim); line-height: 1.6; font-size: 0.9375rem; margin: 0 0 1rem; }
  .card .question{ font-family: "Jua", sans-serif; font-size: 1.125rem; margin: 0 0 0.9rem; line-height: 1.5; }
  .options{ display: flex; flex-direction: column; gap: 0.55rem; }
  .options button{
    position: relative;
    text-align: left;
    background: rgba(255,255,255,0.04);
    border: 1px solid rgba(255,255,255,0.12);
    color: var(--text);
    padding: 0.62rem 0.85rem 0.62rem 1.7rem;
    min-height: 44px;
    border-radius: 10px;
    font-family: inherit;
    font-size: 0.9375rem;
    cursor: pointer;
    transition: background 0.2s ease, border-color 0.2s ease, transform 0.15s ease;
  }
  .options button::before{
    content: "";
    position: absolute; left: 0.75rem; top: 50%;
    width: 5px; height: 5px;
    border-radius: 50%;
    background: var(--gold);
    opacity: 0;
    transform: translateY(-50%) scale(0.4);
    transition: opacity 0.2s ease, transform 0.2s ease;
  }
  .options button:hover{ background: rgba(244,213,141,0.12); border-color: rgba(244,213,141,0.4); transform: translateX(2px); }
  .options button:hover::before{ opacity: 1; transform: translateY(-50%) scale(1); }
  .options button:active{ transform: translateX(2px) scale(0.985); }
  /* picked options stay highlighted so it's clear more than one can be chosen at once */
  .options button.selected{ background: rgba(244,213,141,0.16); border-color: rgba(244,213,141,0.55); }
  .options button.selected::before{ opacity: 1; transform: translateY(-50%) scale(1); }
  .options button.selected::after{ content: "✓"; position: absolute; right: 0.8rem; top: 50%; transform: translateY(-50%); color: var(--gold); font-size: 0.9rem; }
  .options button.selected{ padding-right: 2rem; }
  .opt-pager{ display: flex; align-items: center; justify-content: space-between; gap: 0.5rem; margin-top: 0.2rem; }
  .options .opt-pager button{ width: auto; background: none; border: none; padding: 0.3rem 0.2rem; min-height: 40px;
    font-size: 0.86rem; color: var(--text-dim); text-decoration: underline; text-underline-offset: 3px; transform: none; }
  .options .opt-pager button::before, .options .opt-pager button::after{ content: none; }
  .options .opt-pager button:hover{ background: none; color: var(--text); transform: none; }
  .options .opt-pager .pg-next{ color: var(--gold); }
  .pg-num{ color: var(--text-dim); font-size: 0.78rem; text-align: center; }
  .options button[hidden]{ display: none !important; }
  .multi-note{ color: var(--text-dim); font-size: 0.8125rem; margin: -0.4rem 0 0.8rem; }

  /* free-text answers (message to the shadow, closing reflection): type instead of pick */
  .free-text{
    width: 100%;
    background: rgba(255,255,255,0.04);
    border: 1px solid rgba(255,255,255,0.14);
    color: var(--text);
    padding: 0.7rem 0.85rem;
    border-radius: 10px;
    font-family: inherit;
    font-size: 0.9rem;
    line-height: 1.5;
    resize: vertical;
    margin-bottom: 0.7rem;
  }
  .free-text:focus{ border-color: rgba(244,213,141,0.4); }
  .free-text:focus-visible{ outline: 2px solid rgba(244,213,141,0.7); outline-offset: 1px; }
  .free-text:disabled{ opacity: 0.6; }
  .free-text-reply{
    background: rgba(244,213,141,0.08);
    border: 1px solid rgba(244,213,141,0.25);
    border-radius: 10px;
    padding: 0.7rem 0.85rem;
    margin-bottom: 0.9rem;
    font-size: 0.9rem;
    line-height: 1.6;
    color: var(--text);
    animation: cardRise 0.4s ease both;
  }

  /* persona options: a little mask icon stands in for the bullet — each choice is a
     different face you could put on */
  .options.masked button{
    display: flex;
    align-items: center;
    gap: 0.7rem;
    padding-left: 0.85rem;
  }
  .options.masked button::before{ content: none; }
  .option-mask{
    flex: 0 0 auto;
    width: 36px;
    height: 20px;
    filter: drop-shadow(0 2px 3px rgba(0,0,0,0.45));
    transition: transform 0.2s ease;
  }
  .options.masked button:hover .option-mask{ transform: scale(1.12) rotate(-4deg); }
  .options.masked button.selected{ background: rgba(244,213,141,0.16); border-color: rgba(244,213,141,0.55); }
  .options.masked button.selected .option-mask{ transform: scale(1.12) rotate(-4deg); }

  .synthesis{ line-height: 1.75; font-size: 1rem; color: var(--text); }
  .synthesis .frag{
    color: var(--gold);
    text-shadow: 0 0 12px rgba(244,213,141,0.35);
  }
  .synthesis-divider{
    display: flex; align-items: center; gap: 0.6rem;
    margin: 0.9rem 0;
    color: rgba(244,213,141,0.5);
    font-size: 0.75rem;
  }
  .synthesis-divider::before, .synthesis-divider::after{
    content: "";
    flex: 1 1 auto;
    height: 1px;
    background: linear-gradient(90deg, transparent, rgba(244,213,141,0.4), transparent);
  }

  .primary-btn{
    margin-top: 1.3rem;
    width: 100%;
    background: linear-gradient(180deg, var(--gold), #d8b563);
    border: none;
    color: #241b06;
    padding: 0.75rem;
    border-radius: 10px;
    cursor: pointer;
    font-family: "Jua", sans-serif;
    font-size: 1rem;
    letter-spacing: 1px;
    box-shadow: 0 6px 18px rgba(244,213,141,0.25);
    transition: transform 0.15s ease, box-shadow 0.2s ease;
  }
  .primary-btn:hover{ transform: translateY(-1px); box-shadow: 0 8px 24px rgba(244,213,141,0.4); }
  .primary-btn:active{ transform: translateY(0); }
  .primary-btn:disabled{ opacity: 0.35; cursor: not-allowed; box-shadow: none; transform: none; pointer-events: none; }
  .primary-btn.ghost{
    margin-top: 0.6rem;
    background: transparent;
    color: var(--text-dim);
    box-shadow: none;
    border: 1px solid rgba(255,255,255,0.15);
  }
  .primary-btn.ghost:hover{ box-shadow: none; color: var(--text); border-color: rgba(255,255,255,0.3); }

  /* "마음에 담기": the typed words dissolve into motes that gather into one small light,
     which then stays on the card (and in the tray) so it's visible that something was kept */
  .reflect-box{ position: relative; }
  .reflect-box .free-text{ transition: opacity 0.7s ease, filter 0.7s ease, transform 0.7s ease; }
  .reflect-box.dissolving .free-text{ opacity: 0; filter: blur(6px); transform: translateY(-8px) scale(0.98); }
  .reflect-box.dissolving .primary-btn{ opacity: 0; transition: opacity 0.3s ease; pointer-events: none; }
  .gather-mote{
    position: absolute;
    width: 5px; height: 5px;
    margin: -2.5px 0 0 -2.5px;
    border-radius: 50%;
    background: #fff6e0;
    box-shadow: 0 0 8px 2px rgba(244,213,141,0.8);
    pointer-events: none;
  }
  .kept{ text-align: center; padding: 0.6rem 0 0.2rem; }
  .kept-orb{
    position: relative;
    width: 46px; height: 46px;
    margin: 0.4rem auto 1rem;
    border-radius: 50%;
    background: radial-gradient(circle at 45% 40%, #fffaf0 0%, #f4d58d 45%, #d8a94a 100%);
    box-shadow: 0 0 22px 6px rgba(244,213,141,0.45), 0 0 60px 14px rgba(244,213,141,0.15);
    animation: keptBreathe 3.2s ease-in-out infinite;
  }
  .kept-orb::after{
    content: "";
    position: absolute; inset: -2px;
    border-radius: 50%;
    border: 1.5px solid rgba(244,213,141,0.7);
    opacity: 0;
  }
  .kept.fresh .kept-orb{ animation: keptBloom 0.9s cubic-bezier(.3,1.4,.5,1) both, keptBreathe 3.2s ease-in-out 0.9s infinite; }
  .kept.fresh .kept-orb::after{ animation: keptRing 1.1s ease-out 0.15s both; }
  .kept-text{
    color: var(--gold);
    text-shadow: 0 0 12px rgba(244,213,141,0.35);
    font-size: 1rem;
    line-height: 1.6;
    margin: 0 0 0.5rem;
    word-break: keep-all;
    overflow-wrap: anywhere;
  }
  .kept-ack{ color: var(--text-dim); font-size: 0.85rem; margin: 0; }
  .kept.fresh .kept-text{ animation: cardRise 0.6s ease 0.45s both; }
  .kept.fresh .kept-ack{ animation: cardRise 0.6s ease 0.75s both; }
  .kept .primary-btn{ margin-top: 1.1rem; }
  .kept.fresh .primary-btn{ animation: cardRise 0.6s ease 1.05s both; }
  .kept-edit{
    margin-top: 0.7rem;
    background: none; border: none;
    color: var(--text-dim);
    font-family: inherit; font-size: 0.8rem;
    text-decoration: underline; text-underline-offset: 3px;
    cursor: pointer; opacity: 0.85;
    min-height: 44px; padding: 0 12px;
  }
  .kept-edit:hover{ opacity: 1; color: var(--text); }
  @keyframes keptBloom{ 0%{ transform: scale(0); } 60%{ transform: scale(1.3); } 100%{ transform: scale(1); } }
  @keyframes keptRing{ 0%{ transform: scale(1); opacity: 0.9; } 100%{ transform: scale(3.2); opacity: 0; } }
  @keyframes keptBreathe{
    0%, 100%{ box-shadow: 0 0 22px 6px rgba(244,213,141,0.45), 0 0 60px 14px rgba(244,213,141,0.15); }
    50%{ box-shadow: 0 0 30px 10px rgba(244,213,141,0.6), 0 0 80px 20px rgba(244,213,141,0.22); }
  }
  /* the tray's last slot waits for that light — dashed gold until something is kept */
  .item-slot.heart-slot{ border-color: rgba(244,213,141,0.35); }
  .item-slot.heart-slot .mini-orb{
    width: 14px; height: 14px; border-radius: 50%;
    background: radial-gradient(circle at 45% 40%, #fffaf0, #f4d58d 55%, #d8a94a);
    box-shadow: 0 0 10px 3px rgba(244,213,141,0.5);
  }
  @media (prefers-reduced-motion: reduce){
    .kept.fresh .kept-orb, .kept-orb{ animation: none; }
    .kept.fresh .kept-orb::after{ animation: none; }
  }

  .insight{
    color: var(--text);
    font-size: 0.92rem;
    line-height: 1.7;
    background: rgba(244,213,141,0.06);
    border-left: 2px solid rgba(244,213,141,0.4);
    padding: 0.7rem 0.9rem;
    border-radius: 0 8px 8px 0;
  }
  .reflect-label{
    color: var(--text-dim);
    font-size: 0.88rem;
    margin: 0 0 0.5rem;
  }


  /* ---------- Self: three-step synthesis ---------- */
  .syn-head{ display: flex; align-items: center; justify-content: space-between; gap: 0.6rem; }
  .syn-steps{ display: flex; gap: 6px; margin-right: 1.4rem; }
  .syn-steps span{ width: 22px; height: 4px; border-radius: 2px; background: rgba(255,255,255,0.22); transition: background 0.3s ease; }
  .syn-steps span.on{ background: var(--gold); }
  .syn-sec h2:focus{ outline: none; }
  .syn-sec h2:focus-visible{ outline: 2px solid var(--gold); outline-offset: 4px; }
  .syn-frags{ list-style: none; margin: 0 0 1rem; padding: 0; display: grid; gap: 0.6rem; }
  .syn-frags li{ display: flex; gap: 0.6rem; align-items: flex-start; line-height: 1.6; font-size: 0.92rem; }
  .syn-token{ flex: 0 0 30px; height: 20px; margin-top: 0.15rem; }
  .syn-token svg{ width: 30px; height: 20px; }
  .syn-layer{ display: block; font-family: "Jua", sans-serif; font-size: 0.8rem; color: var(--text-dim); letter-spacing: 0.5px; }
  .syn-frags .frag{ color: var(--gold); }
  .syn-note{ color: var(--text-dim); font-size: 0.82rem; line-height: 1.6; margin: -0.2rem 0 0.8rem; }
  .syn-ground{ color: var(--text-dim); font-size: 0.84rem; line-height: 1.7; text-align: center; margin: 1.2rem 0 0.4rem; }
  .syn-footer{ display: flex; justify-content: space-between; align-items: center; margin-top: 0.6rem; }
  .syn-sec .item-tray{ justify-content: center; margin: 0 0 1rem; }
  .check-row{ display: flex; align-items: center; justify-content: center; gap: 0.5rem; color: var(--text-dim); font-size: 0.85rem; margin-top: 0.9rem; cursor: pointer; min-height: 44px; }
  .check-row input{ width: 18px; height: 18px; accent-color: #f4d58d; }


  /* ---------- the Self ending ---------- */
  .guide-inner{ width: 100%; height: 100%; transition: opacity 1.4s ease, transform 1.4s ease, filter 1.4s ease; }
  .guide-inner.gone{ opacity: 0; transform: translateY(-26px) scale(0.85); filter: brightness(3) blur(2px); }
  #sceneView.ending .touch-controls, #sceneView.ending .scene-hint{ opacity: 0.25; pointer-events: none; transition: opacity 0.8s ease; }
  .self-ending{ position: absolute; inset: 0; z-index: 9; pointer-events: none; overflow: hidden; }
  .self-ending button{ pointer-events: auto; }
  .self-ending::before{ /* the glow that swells around the figure first */
    content: ""; position: absolute; left: var(--cx); top: var(--cy);
    width: 340px; height: 340px; margin: -170px 0 0 -170px; border-radius: 50%;
    /* hollow in the middle so the golden figure itself stays clearly visible */
    background: radial-gradient(circle, rgba(255,245,215,0) 0 20%, rgba(255,238,190,0.5) 30%, rgba(244,213,141,0.22) 48%, transparent 70%);
    opacity: 0; transform: scale(0.4); transition: opacity 1.4s ease, transform 2.2s ease;
  }
  .self-ending.s-glow::before{ opacity: 1; transform: scale(1); }
  /* explicit size: the page-wide `svg { width: 100% }` rule would otherwise stretch it */
  .end-mandala{ position: absolute; left: var(--cx); top: var(--cy); width: 300px; height: 300px; margin: -150px 0 0 -150px; overflow: visible; scale: var(--mk, 1); }
  .end-mandala circle[stroke-dasharray]:not(.end-outer){ transform: rotate(-90deg); }
  .s-ring .end-mandala circle[stroke-dasharray]:not(.end-outer){ animation: drawRing 1.6s cubic-bezier(.5,0,.3,1) forwards; }
  @keyframes drawRing{ to{ stroke-dashoffset: 0; } }
  .end-outer, .end-ray{ opacity: 0; transition: opacity 1.2s ease 1.8s; }
  .s-ring .end-outer{ opacity: 1; }
  .s-ring .end-ray{ opacity: 1; }
  .s-spin .end-mandala{ animation: mandalaTurn 40s linear infinite; }
  @keyframes mandalaTurn{ to{ transform: rotate(360deg); } }
  .end-orbit{ position: absolute; left: var(--cx); top: var(--cy); width: 0; height: 0; }

  /* ---------- the Self: a dawn shoreline instead of an empty field ----------
     land (consciousness) meeting sea (the unconscious) with the sun rising out of the water —
     the Self as the whole that holds both. Only shown in the Self scene (.shore). The sea is a
     band between the sea-horizon (39%) and the shoreline (56%, where everything stands); the
     waves are stacked rows that get bigger and brighter toward the shore and drift sideways,
     and foam keeps washing up onto the sand. */
  .fp-sun, .fp-sea, .fp-wet, .fp-foam{ display: none; }
  .scene-viewport.shore .fp-sun, .scene-viewport.shore .fp-sea, .scene-viewport.shore .fp-wet, .scene-viewport.shore .fp-foam{ display: block; }

    transform: translateY(var(--sun-y, 26px));

  }
  .sea-glitter{ /* the sun's path on the water, widening toward you and flickering */

    background: repeating-linear-gradient(to bottom, rgba(255,255,245,1) 0 2px, transparent 2px 6px);

  @keyframes glitter{ 0%{ background-position: 0 0; opacity: 0.6; } 50%{ opacity: 0.95; } 100%{ background-position: 0 6px; opacity: 0.6; } }
  .wave{ position: absolute; left: -10%; right: -10%; background-repeat: repeat-x; animation: waveDrift linear infinite; }
  .wave.w1{ top: 10%; height: 6px; background-image: url("data:image/svg+xml;utf8,<svg xmlns='http://www.w3.org/2000/svg' width='46' height='6' viewBox='0 0 46 6'><path d='M0 4.9 Q 11.5 1.6 23 4.9 T 46 4.9' fill='none' stroke='rgba(140,80,10,0.33)' stroke-width='1.2' stroke-linecap='round'/><path d='M0 3.3 Q 11.5 0 23 3.3 T 46 3.3' fill='none' stroke='rgba(255,252,236,0.6)' stroke-width='1.2' stroke-linecap='round'/></svg>"); background-size: 46px 6px; animation-duration: 16s; }
  .wave.w2{ top: 27%; height: 9px; background-image: url("data:image/svg+xml;utf8,<svg xmlns='http://www.w3.org/2000/svg' width='70' height='9' viewBox='0 0 70 9'><path d='M0 6.55 Q 17.5 1.6 35 6.55 T 70 6.55' fill='none' stroke='rgba(140,80,10,0.39)' stroke-width='1.5' stroke-linecap='round'/><path d='M0 4.95 Q 17.5 0 35 4.95 T 70 4.95' fill='none' stroke='rgba(255,252,236,0.7)' stroke-width='1.5' stroke-linecap='round'/></svg>"); background-size: 70px 9px; animation-duration: 12s; animation-direction: reverse; }
  .wave.w3{ top: 45%; height: 12px; background-image: url("data:image/svg+xml;utf8,<svg xmlns='http://www.w3.org/2000/svg' width='104' height='12' viewBox='0 0 104 12'><path d='M0 8.2 Q 26 1.6 52 8.2 T 104 8.2' fill='none' stroke='rgba(140,80,10,0.45)' stroke-width='1.9' stroke-linecap='round'/><path d='M0 6.6 Q 26 0 52 6.6 T 104 6.6' fill='none' stroke='rgba(255,252,236,0.82)' stroke-width='1.9' stroke-linecap='round'/></svg>"); background-size: 104px 12px; animation-duration: 9s; }
  .wave.w4{ top: 63%; height: 16px; background-image: url("data:image/svg+xml;utf8,<svg xmlns='http://www.w3.org/2000/svg' width='150' height='16' viewBox='0 0 150 16'><path d='M0 10.4 Q 37.5 1.6 75 10.4 T 150 10.4' fill='none' stroke='rgba(140,80,10,0.5)' stroke-width='2.3' stroke-linecap='round'/><path d='M0 8.8 Q 37.5 0 75 8.8 T 150 8.8' fill='none' stroke='rgba(255,252,236,0.9)' stroke-width='2.3' stroke-linecap='round'/></svg>"); background-size: 150px 16px; animation-duration: 7s; animation-direction: reverse; }
  .wave.w5{ top: 81%; height: 20px; background-image: url("data:image/svg+xml;utf8,<svg xmlns='http://www.w3.org/2000/svg' width='210' height='20' viewBox='0 0 210 20'><path d='M0 12.6 Q 52.5 1.6 105 12.6 T 210 12.6' fill='none' stroke='rgba(140,80,10,0.53)' stroke-width='2.8' stroke-linecap='round'/><path d='M0 11 Q 52.5 0 105 11 T 210 11' fill='none' stroke='rgba(255,252,236,0.97)' stroke-width='2.8' stroke-linecap='round'/></svg>"); background-size: 210px 20px; animation-duration: 5.5s; }
  @keyframes waveDrift{ from{ background-position-x: 0; } to{ background-position-x: 420px; } }

  .scene-viewport.moonlit .fp-moon{

  function freshState(){
    return { v: SCHEMA_VERSION, step: 0, answers: {}, picks: {}, custom: {}, items: {}, choiceIdx: {},

  function load(){
    let s = null;
    try{ const raw = localStorage.getItem(STORAGE_KEY); if (raw) s = JSON.parse(raw); }catch(e){}
    if (!s || typeof s !== "object" || !Number.isInteger(s.step) || s.step < 0 || s.step > layers.length
        || !s.answers || typeof s.answers !== "object"){
      return freshState();
    }
    const base = freshState();
    s = Object.assign(base, s);
    if (s.v !== SCHEMA_VERSION){
      // v1 pushed answers, so re-entering a layer could pile up duplicates — keep only the
      // last run's worth (one fragment per question) for each layer
      layers.forEach(l => {
        const a = s.answers[l.key];
        if (Array.isArray(a) && l.questions) s.answers[l.key] = a.slice(-l.questions.length);
      });
      // anyone who already played v1 has seen the intro in spirit; don't block them with it
      if (s.step > 0) s.onboarded = true;
      s.v = SCHEMA_VERSION;

  }

  function shade(hex, amt){
    const n = parseInt(hex.slice(1),16);
    let r = Math.min(255, Math.max(0, (n>>16) + amt));
    let g = Math.min(255, Math.max(0, ((n>>8)&0xff) + amt));
    let b = Math.min(255, Math.max(0, (n&0xff) + amt));
    return "#" + [r,g,b].map(v=>v.toString(16).padStart(2,"0")).join("");
  }
  function lerpColor(hexA, hexB, t){
    const a = parseInt(hexA.slice(1),16), b = parseInt(hexB.slice(1),16);
    const ar=(a>>16)&255, ag=(a>>8)&255, ab=a&255;
    const br=(b>>16)&255, bg=(b>>8)&255, bb=b&255;
    const r = Math.round(ar+(br-ar)*t), g = Math.round(ag+(bg-ag)*t), bl = Math.round(ab+(bb-ab)*t);

  }

    return `<path d="M${p} Z" fill="${color}" class="${cls || 'hat-spark'}"/>`;
  }

  /* ---------------- MAP VIEW ---------------- */
  const svgCircles = Array.from(document.querySelectorAll("circle.ring"));

  const mapAvatar = document.getElementById("mapAvatar");
  // the player's own look: chosen on the intro card, and carried into the shadow guide

  const IS_TOUCH = window.matchMedia("(pointer: coarse)").matches;

  // whatever sits under an open overlay is made inert (no focus, no clicks, hidden from screen
  // readers), and a closed overlay is inert too — so Tab never wanders behind a dialog
  const titleEl = document.querySelector("h1.title");
  function syncInert(){
    const infoOpen = infoOverlay.classList.contains("open");
    const dlgOpen = overlay.classList.contains("open");
    [mapView, sceneView, titleEl, introSubtitle, document.getElementById("soundBtn")].forEach(el => { el.inert = infoOpen || dlgOpen; });

  const RING_RADII = [280, 220, 165, 110, 55, 0];

    mapAvatar.style.top = (y / 600 * 100) + "%";

  function renderMap(){
    svgCircles.forEach(c => {
      const idx = Number(c.dataset.layer);
      c.classList.remove("locked", "active", "done");
      if (idx < state.step) c.classList.add("done");
      else if (idx === state.step) c.classList.add("active");
      else c.classList.add("locked");
      const l = layers[idx];
      c.setAttribute("role", "button");
      c.setAttribute("tabindex", idx === state.step ? "0" : "-1");
      c.setAttribute("aria-label", idx < state.step ? `${l.name} 층 — 지나옴`

    layers.forEach((l, i) => {

    layers.filter(l => l.key !== "self").forEach(l => {

  let overlayReturnFocus = null;
  function openOverlay(mode){

    // only hand focus back if that element is still on screen (the view may have changed)
    if (back && back.focus && document.contains(back) && back.offsetParent !== null){
      back.focus({ preventScroll: true });

  }
  // move keyboard focus into a freshly rendered card (first option / button / input)
  function focusFirstIn(root){
    setTimeout(() => {
      const f = root.querySelector(".options button, textarea:not([disabled]), input:not([hidden]), .primary-btn:not([disabled]), button");

  function showInfo(layer){

    if (!infoOverlay.classList.contains("open")) return;
    infoOverlay.classList.remove("open");
    syncInert();
    const back = infoReturnFocus;
    infoReturnFocus = null;
    if (back && back.focus && document.contains(back)) back.focus({ preventScroll: true });
    if (typeof closeInfo.onClose === "function"){ const f = closeInfo.onClose; closeInfo.onClose = null; f(); }
  }
  infoOverlay.addEventListener("click", e => { if (e.target === infoOverlay) closeInfo(); });
  mapInfoBtn.addEventListener("click", () => {
    showInfo(layers[Math.min(state.step, layers.length - 1)]);
  });



  // the option id that stands for a layer (its first question's representative pick);
  // falls back to the old index-based record for journeys saved before ids existed
  function layerChoiceId(key){
    if (state.choiceId && state.choiceId[key]) return state.choiceId[key];
    const idx = state.choiceIdx && state.choiceIdx[key];
    const l = layers.find(x => x.key === key);
    const opt = idx != null && l && l.questions && l.questions[0].options[idx];
    return opt ? opt.id : null;
  }
  // two sentences at most — a whole paragraph (one line per layer plus extras) was too long
  // to take in; the deepest layers speak first
  function buildInsight(){
    const parts = [];
    ["shadow", "anima", "ego", "persona"].forEach(key => {
      if (parts.length >= 2) return;
      const id = layerChoiceId(key);
      const t = id && INSIGHT_TEMPLATES[key][id];
      if (!t) return;
      const picks = (state.picks && state.picks[key]) || [];
      const custom = (state.custom && state.custom[key] && state.custom[key][0]) || "";
      const line = typeof t === "function" ? t({ picks, custom }) : t;
      if (line) parts.push(line);
    });
    return parts.join(" ");
  }

  /* ---------------- result image (to keep in your gallery) ---------------- */
  // drawn straight onto a canvas rather than screenshotting the card, so the saved image is
  // laid out for a phone gallery (tall, fixed width) and doesn't depend on scroll position

  // breaks at spaces where it can (Korean reads better that way), mid-word only when a
  // single word is wider than the line
  function wrapText(ctx, text, maxW){
    const out = [];
    for (const para of String(text).split("\n")){
      let line = "";
      for (const ch of para){
        const test = line + ch;
        if (ctx.measureText(test).width > maxW && line){
          const sp = line.lastIndexOf(" ");
          if (sp > 0){ out.push(line.slice(0, sp)); line = line.slice(sp + 1) + ch; }
          else { out.push(line); line = ch.trim() ? ch : ""; }
        } else {
          line = test;
        }
      }
      out.push(line);
    }
    return out;
  }

  function drawOrb(ctx, cx, cy, r){
    ctx.save();
    ctx.shadowColor = "rgba(244,213,141,0.7)";
    ctx.shadowBlur = r * 1.6;
    const g = ctx.createRadialGradient(cx - r * 0.15, cy - r * 0.2, 0, cx, cy, r);
    g.addColorStop(0, "#fffaf0"); g.addColorStop(0.45, "#f4d58d"); g.addColorStop(1, "#d8a94a");
    ctx.fillStyle = g;
    ctx.beginPath(); ctx.arc(cx, cy, r, 0, Math.PI * 2); ctx.fill();
    ctx.restore();
  }
  function roundRect(ctx, x, y, w, h, r){
    ctx.beginPath();
    ctx.moveTo(x + r, y);
    ctx.arcTo(x + w, y, x + w, y + h, r);
    ctx.arcTo(x + w, y + h, x, y + h, r);
    ctx.arcTo(x, y + h, x, y, r);
    ctx.arcTo(x, y, x + w, y, r);
    ctx.closePath();
  }

  // runs twice: once with doDraw=false just to measure how tall the content is, then
  // again for real on a canvas sized to fit. returns the y where content ended.
  function drawResultCard(ctx, W, doDraw, startY){
    const GOLD = "#f4d58d", TEXT = "#f1ece2", DIM = "#b8b2c4";
    const P = 110, inner = W - P * 2;
    let y = startY;
    const text = (str, size, color, { font = "Gowun Dodum", align = "left", lh = 1.65, x = P, maxW = inner, glow = false } = {}) => {
      ctx.font = `${size}px "${font}"`;
      const lines = wrapText(ctx, str, maxW);
      if (doDraw){
        ctx.save();
        ctx.fillStyle = color;
        ctx.textAlign = align;
        ctx.textBaseline = "top";
        if (glow){ ctx.shadowColor = "rgba(244,213,141,0.45)"; ctx.shadowBlur = 24; }
        lines.forEach((l, i) => ctx.fillText(l, align === "center" ? W / 2 : x, y + i * size * lh));
        ctx.restore();
      }
      y += lines.length * size * lh;
    };
    const divider = () => {
      y += 44;
      if (doDraw){
        const g = ctx.createLinearGradient(P, 0, W - P, 0);
        g.addColorStop(0, "rgba(244,213,141,0)"); g.addColorStop(0.5, "rgba(244,213,141,0.45)"); g.addColorStop(1, "rgba(244,213,141,0)");
        ctx.fillStyle = g;
        ctx.fillRect(P, y, W / 2 - P - 30, 1.5);
        ctx.fillRect(W / 2 + 30, y, W / 2 - P - 30, 1.5);
        ctx.fillStyle = "rgba(244,213,141,0.6)";
        ctx.font = '22px "Gowun Dodum"'; ctx.textAlign = "center"; ctx.textBaseline = "middle";
        ctx.fillText("✦", W / 2, y + 1);
      }
      y += 56;
    };

    // header
    text("마음숲 모험", 70, GOLD, { font: "Jua", align: "center", lh: 1.2, glow: true });
    y += 16;
    const d = new Date();
    text(`${d.getFullYear()}. ${d.getMonth() + 1}. ${d.getDate()}`, 28, DIM, { align: "center", lh: 1.2 });
    // the tray: four masks you earned + the light you kept
    y += 56;
    const slotW = 124, slotH = 80, gap = 26, count = 5;
    let sx = (W - (slotW * count + gap * (count - 1))) / 2;
    const trayLayers = layers.filter(l => l.key !== "self");
    for (let i = 0; i < count; i++){
      if (doDraw){
        roundRect(ctx, sx, y, slotW, slotH, 18);
        ctx.fillStyle = "rgba(244,213,141,0.06)"; ctx.fill();
        ctx.strokeStyle = "rgba(244,213,141,0.35)"; ctx.lineWidth = 2; ctx.stroke();
        const cx = sx + slotW / 2, cy = y + slotH / 2;
        if (i < trayLayers.length){
          const color = state.items && state.items[trayLayers[i].key];
          if (color) drawToken(ctx, trayLayers[i].key, color, cx, cy, 1.75);
        } else if (state.reflection){
          drawOrb(ctx, cx, cy, 17);
        }
      }
      sx += slotW + gap;
    }
    y += slotH;

    // what you found in each layer
    divider();
    trayLayers.forEach((l, i) => {
      const frags = layerSummary(l.key);
      if (!frags) return;
      if (i > 0) y += 34;
      text(l.name, 30, GOLD, { font: "Jua", lh: 1.3 });
      y += 8;
      text(frags, 33, TEXT);
    });

    // the reflection built from your choices, in a soft box with a gold edge
    const insight = buildInsight();
    if (insight){
      divider();
      const size = 31, lh = 1.75, padX = 40, padY = 34;
      ctx.font = `${size}px "Gowun Dodum"`;
      const lines = wrapText(ctx, insight, inner - padX * 2);
      const boxH = lines.length * size * lh + padY * 2 - size * (lh - 1);
      if (doDraw){
        ctx.fillStyle = "rgba(244,213,141,0.07)";
        roundRect(ctx, P, y, inner, boxH, 14); ctx.fill();
        ctx.fillStyle = "rgba(244,213,141,0.5)";
        ctx.fillRect(P, y + 10, 4, boxH - 20);
      }
      const top = y;
      y += padY;
      text(insight, size, TEXT, { x: P + padX, maxW: inner - padX * 2, lh });
      y = top + boxH;
    }

    if (state.reflection){
      divider();
      y += 10;
      if (doDraw) drawOrb(ctx, W / 2, y + 40, 40);
      y += 120;
      text("오늘 마음에 담아간 것", 28, DIM, { align: "center", lh: 1.3 });
      y += 20;
      text(`“${state.reflection}”`, 44, GOLD, { font: "Jua", align: "center", lh: 1.5, glow: true });
    }
    return y;
  }

  async function renderResultImage(){
    try{
      await Promise.all([document.fonts.load('70px "Jua"'), document.fonts.load('32px "Gowun Dodum"')]);
    }catch(e){}
    // always exactly 1080×1920 (9:16, a phone story / wallpaper): if the content runs long it
    // is laid out on a proportionally wider logical page and scaled down to fit, rather than
    // the image growing taller and getting cropped wherever it's shared
    const W = 1080, H = 1920, PAD_TOP = 150, PAD_BOTTOM = 190;
    const canvas = document.createElement("canvas");
    canvas.width = W; canvas.height = 10;
    const measureCtx = canvas.getContext("2d");
    let k = 1, contentH = drawResultCard(measureCtx, W, false, 0);
    while (contentH * k > H - PAD_TOP - PAD_BOTTOM && k > 0.5){
      k -= 0.04;
      contentH = drawResultCard(measureCtx, W / k, false, 0);
    }
    canvas.height = H;
    const ctx = canvas.getContext("2d");

    // night-sky background + a few stars, same mood as the page
    const bg = ctx.createRadialGradient(W / 2, H * 0.45, 0, W / 2, H * 0.45, H * 0.75);
    bg.addColorStop(0, "#1a1f2b"); bg.addColorStop(0.6, "#0d1017"); bg.addColorStop(1, "#05060a");
    ctx.fillStyle = bg; ctx.fillRect(0, 0, W, H);
    for (let i = 0; i < 90; i++){
      ctx.fillStyle = `rgba(255,255,255,${0.15 + Math.random() * 0.5})`;
      ctx.beginPath(); ctx.arc(Math.random() * W, Math.random() * H, Math.random() * 1.8 + 0.4, 0, Math.PI * 2); ctx.fill();
    }
    ctx.strokeStyle = "rgba(244,213,141,0.28)"; ctx.lineWidth = 2;
    roundRect(ctx, 50, 50, W - 100, H - 100, 36); ctx.stroke();

    // center the content vertically when there's room to spare
    ctx.save();
    ctx.scale(k, k);
    drawResultCard(ctx, W / k, true, Math.max(PAD_TOP, (H - contentH * k) / 2 - 20) / k);
    ctx.restore();

    ctx.fillStyle = "rgba(184,178,196,0.85)";
    ctx.font = '24px "Gowun Dodum"'; ctx.textAlign = "center"; ctx.textBaseline = "alphabetic";
    ctx.fillText("심리학자 칼 융의 마음 지도를 따라 나를 찾아가는 길 · 마음숲 모험", W / 2, H - 92);

    return new Promise((res, rej) => canvas.toBlob(b => b ? res(b) : rej(new Error("toBlob failed")), "image/png"));
  }

  // on phones the share sheet is what has "이미지 저장" (straight into the photo gallery);
  // on a computer a plain download is what people expect
  async function saveResultImage(btn){
    const label = btn.textContent;
    btn.disabled = true;
    btn.textContent = "이미지를 만드는 중...";
    try{
      const blob = await renderResultImage();
      const d = new Date();
      const name = `마음숲모험_${d.getFullYear()}${String(d.getMonth() + 1).padStart(2, "0")}${String(d.getDate()).padStart(2, "0")}.png`;
      const file = new File([blob], name, { type: "image/png" });
      const isTouch = window.matchMedia("(pointer: coarse)").matches;
      if (isTouch && navigator.canShare && navigator.canShare({ files: [file] })){
        try{
          await navigator.share({ files: [file], title: "마음숲 모험" });
          return;
        }catch(e){
          if (e.name === "AbortError") return;
        }
      }
      const url = URL.createObjectURL(blob);
      const a = document.createElement("a");
      a.href = url; a.download = name;
      document.body.appendChild(a); a.click(); a.remove();
      setTimeout(() => URL.revokeObjectURL(url), 2000);
    }catch(e){
      showToast("이미지를 만들지 못했어요. 대신 화면을 캡처해 주세요.", 4200);
    }finally{
      btn.disabled = false;
      btn.textContent = label;
    }
  }

  // one short line per layer for the synthesis and the saved image: the first answer (what
  // stood out) and the last (what lay underneath), instead of every fragment comma-joined
  // into one breathless sentence
  function layerSummary(key){
    const a = (Array.isArray(state.answers[key]) ? state.answers[key] : [state.answers[key]]).filter(Boolean);
    if (!a.length) return "";
    // the third answer is the "what lies underneath" one in every layer that has it
    return a.length === 1 ? a[0] : `${a[0]} · ${a[Math.min(2, a.length - 1)]}`;
  }

  // the Self, in three steps instead of one long scroll with three gold buttons:
  // 1) the pieces gather into the center (a visual moment of integration) + the reflection,
  // 2) a word to the shadow, 3) what you take home + the image. One primary action per step.
  function showSynthesis(startStep){
    const trayLayers = layers.filter(l => l.key !== "self");
    card.innerHTML = `
      <div class="syn-head">
        <div class="badge">☀️ 자기(Self)</div>
        <div class="syn-steps" aria-hidden="true"><span></span><span></span></div>
      </div>
      <section class="syn-sec" data-syn="1" aria-label="1단계: 조각들이 한자리에">
        <h2 tabindex="-1">조각들이 한자리에</h2>
        <ul class="syn-frags">
          ${trayLayers.map(l => {
            const sum = layerSummary(l.key);
            if (!sum) return "";
            const color = state.items && state.items[l.key];
            const icon = l.key === "persona" && state.mask ? customMaskSVG(state.mask) : color ? layerTokenMarkup(l.key, color) : "";
            return `<li><span class="syn-token">${icon}</span>
              <span><span class="syn-layer">${l.name}</span><span class="frag">${escapeHtml(sum)}</span></span></li>`;
          }).join("")}
        </ul>
        <p class="insight">${escapeHtml(buildInsight())}</p>
        <button class="primary-btn" data-go="2">마음에 담으러 가기</button>
      </section>
      <section class="syn-sec" data-syn="2" aria-label="2단계: 마음에 담기" hidden>
        <h2 tabindex="-1">마음에 담기</h2>
        <div class="item-tray" id="synthesisTray"></div>
        <p class="reflect-label">오늘 이 여정에서, 무엇을 가지고 돌아가고 싶나요?</p>
        <div class="reflect-box" id="reflectBox"></div>
        <p class="syn-ground">이제 발밑의 땅을 느끼며, 천천히 지금 여기로 돌아와요. 개성화는 무언가를 고쳐 완성하는 것이 아니라, 이미 내 안에 있는 온전함을 조금씩 알아 가는 과정이에요.</p>
        <div class="syn-footer">
          <button class="text-link" data-go="1">← 이전</button>
          <button class="text-link" id="restartBtn">처음부터 다시 떠나기</button>
        </div>
      </section>
    `;

    const sections = [...card.querySelectorAll(".syn-sec")];
    const dots = [...card.querySelectorAll(".syn-steps span")];
    const goStep = (n, focus) => {
      sections.forEach(sec => { sec.hidden = sec.dataset.syn !== String(n); });
      dots.forEach((d, i) => d.classList.toggle("on", i < n));
      card.scrollTop = 0;
      if (focus){ const h = card.querySelector(`.syn-sec[data-syn="${n}"] h2`); if (h) h.focus({ preventScroll: true }); }
    };
    card.querySelectorAll("[data-go]").forEach(b => b.addEventListener("click", () => goStep(Number(b.dataset.go), true)));

    const synthesisTray = card.querySelector("#synthesisTray");
    trayLayers.forEach(l => {
      const slot = document.createElement("div");
      const color = state.items && state.items[l.key];
      slot.className = "item-slot" + (color ? " filled" : "");
      if (color){ slot.innerHTML = layerTokenMarkup(l.key, color); slot.style.borderColor = shade(l.light, 40); }
      slot.title = color ? `${l.name}에서 얻은 ${LAYER_TOKEN_NAMES[l.key]}` : l.name;
      synthesisTray.appendChild(slot);
    });
    const heartSlot = document.createElement("div");
    heartSlot.className = "item-slot heart-slot";
    heartSlot.title = "오늘 마음에 담아갈 것";
    synthesisTray.appendChild(heartSlot);
    const fillHeartSlot = (filled) => {
      heartSlot.classList.toggle("filled", filled);
      heartSlot.innerHTML = filled ? `<div class="mini-orb"></div>` : "";
    };

    const reflectBox = card.querySelector("#reflectBox");
    const reduceMotion = prefersReducedMotion();
    const renderReflectInput = (text) => {
      reflectBox.classList.remove("dissolving");
      reflectBox.style.minHeight = "";
      reflectBox.innerHTML = `
        <textarea class="free-text" id="reflectInput" rows="2" placeholder="한 줄이어도 괜찮아요..."></textarea>
        <button class="primary-btn" id="reflectSaveBtn">마음에 담기</button>
      `;
      const input = reflectBox.querySelector("#reflectInput");
      input.value = text || "";
      reflectBox.querySelector("#reflectSaveBtn").onclick = () => {
        const t = input.value.trim();
        if (!t) { input.focus(); return; }
        state.reflection = t;
        save();
        keepReflection(input, t);
        if (checkCrisis(t)) setTimeout(() => showSupport(true), reduceMotion ? 0 : 1300);
      };
    };
    const renderReflectKept = (text, fresh) => {
      reflectBox.classList.remove("dissolving");
      reflectBox.innerHTML = `
        <div class="kept${fresh ? " fresh" : ""}">
          <div class="kept-orb"></div>
          <p class="kept-text"></p>
          <p class="kept-ack">이 마음을 당신 안에 담았어요.</p>
          <button class="primary-btn" id="saveImageBtn">이미지로 간직하기</button>
          <button class="kept-edit">다시 적기</button>
        </div>
      `;
      reflectBox.querySelector(".kept-text").textContent = `“${text}”`;
      const saveBtn = reflectBox.querySelector("#saveImageBtn");
      saveBtn.onclick = () => saveResultImage(saveBtn);
      reflectBox.querySelector(".kept-edit").onclick = () => {
        fillHeartSlot(false);
        renderReflectInput(state.reflection);
      };
      fillHeartSlot(true);
      if (fresh) setTimeout(() => { reflectBox.style.minHeight = ""; }, 900);
    };
    // the words blur away while small motes rise from where they were written and drift
    // together into one point — that point is where the kept light then blooms
    const keepReflection = (input, text) => {
      if (reduceMotion){ renderReflectKept(text, false); return; }
      const boxRect = reflectBox.getBoundingClientRect();
      const inRect = input.getBoundingClientRect();
      reflectBox.style.minHeight = boxRect.height + "px";
      reflectBox.classList.add("dissolving");
      const cx = boxRect.width / 2, cy = 33;
      const ox = inRect.left - boxRect.left, oy = inRect.top - boxRect.top;
      for (let i = 0; i < 22; i++){
        const m = document.createElement("div");
        m.className = "gather-mote";
        const sx = ox + 10 + Math.random() * (inRect.width - 20);
        const sy = oy + 8 + Math.random() * (inRect.height - 16);
        m.style.left = sx + "px";
        m.style.top = sy + "px";
        reflectBox.appendChild(m);
        // rise a little first (with some sideways drift), then curve in to the center
        const dx = cx - sx, dy = cy - sy;
        const midX = dx * 0.3 + (Math.random() - 0.5) * 40;
        const midY = dy * 0.2 - 20 - Math.random() * 30;
        m.animate([
          { transform: "translate(0,0) scale(0.4)", opacity: 0 },
          { transform: `translate(${midX}px, ${midY}px) scale(1.2)`, opacity: 1, offset: 0.35 },
          { transform: `translate(${dx}px, ${dy}px) scale(0.6)`, opacity: 0.9 }
        ], { duration: 900 + Math.random() * 300, delay: Math.random() * 250, easing: "cubic-bezier(.5,0,.3,1)", fill: "forwards" });
      }
      Sound.gather();
      setTimeout(() => renderReflectKept(text, true), 1250);
    };
    if (state.reflection){
      renderReflectKept(state.reflection, false);
    } else {
      renderReflectInput("");
    }
    card.querySelector("#restartBtn").onclick = () => {
      if (!confirm("지금까지 담은 이야기(답, 마음에 담은 것)가 모두 지워져요.\n이미지로 먼저 간직하지 않았다면 취소를 눌러 주세요.\n\n처음부터 다시 떠날까요?")) return;
      const keep = { onboarded: state.onboarded, seenInfo: state.seenInfo, soundOn: state.soundOn, avatar: state.avatar };
      state = Object.assign(freshState(), keep);
      save();
      closeOverlay();
      document.querySelector('circle.self-core').classList.remove('bloom');
      setTimeout(renderMap, 300);
    };
    openOverlay("card");
    goStep(startStep || 1, false);
  }

  svgCircles.forEach(c => {
    c.addEventListener("click", () => {
      const idx = Number(c.dataset.layer);
      if (idx < state.step) return;
      if (idx > state.step){
        c.classList.remove("shake"); void c.offsetWidth; c.classList.add("shake");
        showToast(`먼저 ${layers[state.step].name} 층을 지나야 해요`, 2000);
        return;
      }
      enterScene(idx);
    });
    c.addEventListener("keydown", e => {
      if (e.key === "Enter" || e.key === " "){ e.preventDefault(); c.dispatchEvent(new MouseEvent("click")); }
    });
  });
  reopenBtn.addEventListener("click", () => showSynthesis(1));
  overlay.addEventListener("click", (e) => {
    if (e.target === overlay && state.step >= layers.length) closeOverlay();
  });

  /* ---------------- SCENE (first-person walking corridor) ---------------- */
  const sceneViewportEl = document.getElementById("sceneViewport");
  const sceneRaysEl = document.getElementById("sceneRays");
  const sceneFlashEl = document.getElementById("sceneFlash");
  const fpSky = document.getElementById("fpSky");
  const fpSky2 = document.getElementById("fpSky2");
  const fpGround = document.getElementById("fpGround");
  const fpWorld = document.getElementById("fpWorld");
  const fpBob = document.getElementById("fpBob");
  const fpObjects = document.getElementById("fpObjects");
  const fpMoon = document.getElementById("fpMoon");
  const moonRoad = document.getElementById("moonRoad");
  const talkPrompt = document.getElementById("talkPrompt");
  const edgeHint = document.getElementById("edgeHint");
  const sceneTitle = document.getElementById("sceneTitle");
  const sceneInfoBtn = document.getElementById("sceneInfoBtn");
  const backToMapBtn = document.getElementById("backToMapBtn");
  sceneInfoBtn.addEventListener("click", () => { if (scene) showInfo(scene.layer); });
  const btnForward = document.getElementById("btnForward");
  const btnLookL = document.getElementById("btnLookL");
  const btnLookR = document.getElementById("btnLookR");
  const btnTalk = document.getElementById("btnTalk");
  if (IS_TOUCH){
    talkPrompt.textContent = "💬 버튼을 눌러 대화하기";
    document.getElementById("sceneHint").textContent = "⬆ 꾹 눌러 걷기 · 💬 대화";
  }

  // the 3D world, if this device can draw it (?classic=1 keeps the older flat scene). The game's
  // distances stay in its own units: K3 of them make one metre in the 3D world, chosen so the
  // talk distance and obstacle ranges come out natural (TALK_DIST 260 ≈ 4.2 m).
  let USE3D = false;
  const K3 = 62;
  try{
    if (!/[?&]classic=1/.test(location.search) && window.Forest3D && Forest3D.supported()){
      Forest3D.init(document.getElementById("view3d"));
      USE3D = true;
    }
  }catch(e){ USE3D = false; }
  const NPC_Z = Math.round(2200 * PATH_STRETCH);
  const SELF_Z = 1550;
  const SELF_STOP = 70;     // how close to the Self figure you come to rest for the ending
  const SPEED = 0.62;       // depth units per ms
  const TALK_DIST = 260;
  const WALL_MARGIN = 32;

  let scene = null;
  let keys = { forward: false, lookL: false, lookR: false };
  let rafId = null;
  let lastTime = 0;

  // every tree of a given color shares one set of gradients instead of each of the (up to
  // ~100) tree instances defining its own — with a whole forest on screen, redefining
  // identical gradients per-tree was a real chunk of the startup cost.
  const treeGradCache = new Set();
  let treeDefsEl = null;
  function ensureTreeGradients(color){
    const key = "tg" + color.replace("#", "");
    if (treeGradCache.has(key)) return key;
    treeGradCache.add(key);
    if (!treeDefsEl){
      treeDefsEl = document.getElementById("treeDefs");
    }
    const dk = shade(color, -35);
    const dk2 = shade(color, -18);
    const lt = shade(color, 22);
    const moss = shade(color, 48);
    treeDefsEl.insertAdjacentHTML("beforeend", `
      <linearGradient id="${key}-trunk" x1="0" y1="0" x2="1" y2="0">
        <stop offset="0%" stop-color="#3c2c1e"/>
        <stop offset="50%" stop-color="#6b4f36"/>
        <stop offset="100%" stop-color="#3c2c1e"/>
      </linearGradient>
      <radialGradient id="${key}-fol" cx="34%" cy="26%" r="78%">
        <stop offset="0%" stop-color="${lt}"/>
        <stop offset="55%" stop-color="${color}"/>
        <stop offset="100%" stop-color="${dk}"/>
      </radialGradient>
      <radialGradient id="${key}-shadow" cx="50%" cy="50%" r="50%">
        <stop offset="0%" stop-color="#000" stop-opacity="0.4"/>
        <stop offset="70%" stop-color="#000" stop-opacity="0.2"/>
        <stop offset="100%" stop-color="#000" stop-opacity="0"/>
      </radialGradient>
      <radialGradient id="${key}-moss" cx="50%" cy="50%" r="50%">
        <stop offset="0%" stop-color="${moss}" stop-opacity="0.7"/>
        <stop offset="100%" stop-color="${moss}" stop-opacity="0"/>
      </radialGradient>
    `);
    return key;
  }
  // a small venetian-style mask icon, one per persona dialogue option — each option is a
  // different face you could put on, so each gets its own mask rather than a plain bullet
  // each layer leaves its own token instead of every one being a mask: mask (persona),
  // compass (ego), crescent (shadow), twin lights (anima). Same path data drives the SVG icon
  // and the canvas drawing in the result image. All drawn in a 72×48 box centered on (36,24).
  const fourPoint = (cx, cy, s) => {
    const p = [[cx, cy - s], [cx + s * 0.28, cy - s * 0.28], [cx + s, cy], [cx + s * 0.28, cy + s * 0.28],
               [cx, cy + s], [cx - s * 0.28, cy + s * 0.28], [cx - s, cy], [cx - s * 0.28, cy - s * 0.28]];
    return "M" + p.map(q => q.map(v => v.toFixed(2)).join(",")).join(" L") + " Z";
  };
  const TOKEN_SHAPES = {
    persona: [
      { d: "M14,24 Q22,14 30,21 Q36,15 42,21 Q50,14 58,24 Q56,35 46,34 Q40,39 33,34 Q30,39 26,34 Q16,35 14,24 Z", fill: "c", stroke: true },
      { d: "M21.8,25 a5.2,5.8 0 1,0 10.4,0 a5.2,5.8 0 1,0 -10.4,0 Z M39.8,25 a5.2,5.8 0 1,0 10.4,0 a5.2,5.8 0 1,0 -10.4,0 Z", fill: "dk" }
    ],
    ego: [
      { d: "M22,24 a14,14 0 1,0 28,0 a14,14 0 1,0 -28,0 Z", fill: "c", stroke: true },
      { d: "M36,12.5 L39.6,24 L36,35.5 L32.4,24 Z", fill: "dk" },
      { d: "M34.2,24 a1.8,1.8 0 1,0 3.6,0 a1.8,1.8 0 1,0 -3.6,0 Z", fill: "lt" }
    ],
    shadow: [
      { d: "M41,9.5 A14.5,14.5 0 1,0 41,38.5 A11.5,11.5 0 1,1 41,9.5 Z", fill: "c", stroke: true }
    ],
    anima: [
      { d: fourPoint(29, 27, 10), fill: "c", stroke: true },
      { d: fourPoint(45, 19, 7.5), fill: "lt", stroke: true }
    ]
  };
  function tokenColors(color){ return { c: color, dk: shade(color, -38), lt: shade(color, 55) }; }
  function layerTokenMarkup(key, color){
    const shapes = TOKEN_SHAPES[key] || TOKEN_SHAPES.persona;
    const col = tokenColors(color);
    return `<svg viewBox="0 0 72 48" class="option-mask layer-token" aria-hidden="true">${shapes.map(sh =>
      `<path d="${sh.d}" fill="${col[sh.fill]}"${sh.stroke ? ` stroke="${col.dk}" stroke-width="2.2" stroke-linejoin="round"` : ""}/>`).join("")}</svg>`;
  }
  function drawToken(ctx, key, color, cx, cy, scale){
    const shapes = TOKEN_SHAPES[key] || TOKEN_SHAPES.persona;
    const col = tokenColors(color);
    ctx.save();
    ctx.translate(cx, cy); ctx.scale(scale, scale); ctx.translate(-36, -24);
    shapes.forEach(sh => {
      const p = new Path2D(sh.d);
      ctx.fillStyle = col[sh.fill]; ctx.fill(p);
      if (sh.stroke){ ctx.strokeStyle = col.dk; ctx.lineWidth = 2.2; ctx.lineJoin = "round"; ctx.stroke(p); }
    });
    ctx.restore();
  }
  const LAYER_TOKEN_NAMES = { persona: "가면", ego: "나침반", shadow: "초승달", anima: "쌍둥이 빛" };

  function maskIconMarkup(color){
    const dk = shade(color, -30);
    return `<svg viewBox="0 0 72 40" class="option-mask">
      <path d="M14,24 Q22,14 30,21 Q36,15 42,21 Q50,14 58,24 Q56,35 46,34 Q40,39 33,34 Q30,39 26,34 Q16,35 14,24 Z"
            fill="${color}" stroke="${dk}" stroke-width="2.5" stroke-linejoin="round"/>
      <ellipse cx="27" cy="25" rx="5.2" ry="5.8" fill="${dk}"/>
      <ellipse cx="45" cy="25" rx="5.2" ry="5.8" fill="${dk}"/>
    </svg>`;
  }
  const MASK_PALETTE = ["#d9b25c", "#7a8fa6", "#b56b6b", "#7ba876", "#9a7bc4", "#4f9d8a", "#c9784a", "#b06a9a"];

  // whether a Korean word ends in a syllable with a batchim (final consonant) — decides
  // 이라는 vs 라는, 을/를, 이/가 etc. for text that varies at runtime
  function hasBatchim(str){
    const s = String(str || "").trim();
    if (!s) return false;
    const code = s.charCodeAt(s.length - 1);
    if (code < 0xAC00 || code > 0xD7A3) return false;
    return (code - 0xAC00) % 28 !== 0;
  }
  const josa = (word, withB, withoutB) => hasBatchim(word) ? withB : withoutB;

  // a short, non-diagnostic reflection built from what you picked in each layer — keyed by
  // option id (not position), so reordering options can never silently mismatch them.
  // Entries can be functions that look at later answers ({ picks, custom }): an insight must
  // not tell someone who said "I'm genuinely calm" that their calm might be suppression.
  const quoteTyped = (t, tail) => `"${t}"${josa(t, "이라는", "라는")} ${tail}`;
  const INSIGHT_TEMPLATES = {
    persona: {
      smile: "사람들 앞에서 늘 밝은 척 웃어왔다면, 그 뒤에 쌓인 마음도 함께 살펴봐 주세요.",
      capable: "빈틈없이 유능해 보이려 애써왔다면, 가끔은 그 긴장을 내려놔도 괜찮아요.",
      cool: ({ picks }) => ((picks[1] || []).includes(3) || (picks[2] || []).includes(3))
        ? "무던하게 지내는 것이 정말 당신다운 모습이라면, 그 담담함도 소중한 힘이에요."
        : "아무렇지 않은 척 지내왔다면, 그 아래에서 마음이 흔들릴 때도 있었는지 가만히 물어봐 주세요.",
      pleaser: "늘 맞춰주고 좋은 사람이려 애써왔다면, 가끔은 당신 마음도 먼저 챙겨봐도 괜찮아요.",
      joker: "분위기를 띄우고 웃음을 주는 역할을 도맡아왔다면, 당신도 위로받을 자격이 있다는 걸 잊지 마세요.",
      strong: "세고 단단해 보이려 애써왔다면, 가끔은 누군가에게 기대어 쉬어도 괜찮다는 걸 기억해 주세요.",
      authentic: "꾸미지 않고 있는 그대로 보여줄 수 있었다면, 그건 이미 큰 용기였어요.",
      hedgehog: "미리 가시를 세워 왔다면, 그건 상처받지 않으려는 마음의 울타리였어요. 편한 사람 앞에선 조금 눕혀도 괜찮아요.",
      owl: "한발 물러서 지켜봐 왔다면, 다치지 않으려는 거리였을지 몰라요. 정말 아끼는 것 앞에선 한 걸음 다가가도 괜찮아요.",
      martyr: "늘 남의 짐을 먼저 져 왔다면, 그 돌봄을 이제 당신 자신에게도 조금 나눠 주세요.",
      invisible: "존재감을 지우며 지내 왔다면, 마음이 숨을 곳을 찾았던 거예요. 가끔은 당신의 목소리를 내도 괜찮아요.",

  // maps a layer key to its Q1-branching follow-up table, so renderQuestion() can look
